packages:
  - "apps/*"
  - "packages/*"

# Owner decision 2026-11-07 (#738, amendment 5): never resolve a version published less than 7 days ago
# (in minutes). A frozen-lockfile install resolves nothing, so CI is unaffected; `pnpm add` and
# `pnpm update` pick the newest version at least a week old.
minimumReleaseAge: 10080
