{
  "queries": {
    "ai_apps_macos": {
      "query": "SELECT name, bundle_identifier, bundle_short_version, path, element FROM apps WHERE lower(name) IN ('chatgpt.app', 'claude.app', 'cursor.app', 'fireflies.app', 'grammarly desktop.app', 'lm studio.app', 'ollama.app', 'otter.app', 'perplexity.app', 'warp.app', 'windsurf.app', 'wispr flow.app') OR lower(bundle_identifier) IN ('ai.otter.otter', 'ai.perplexity.mac', 'com.anthropic.claudefordesktop', 'com.codeium.windsurf', 'com.grammarly.projectllama', 'com.openai.chat', 'com.todesktop.230313mzl4w4u92', 'dev.warp.warp-stable');",
      "interval": 86400,
      "platform": "darwin",
      "description": "Installed macOS applications whose bundle name or bundle identifier is in the AI catalogue. Tables: apps.",
      "snapshot": true,
      "removed": false
    },
    "ai_programs_windows": {
      "query": "SELECT name, version, publisher FROM programs WHERE lower(name) IN ('chatgpt', 'claude', 'cursor', 'fireflies', 'grammarly', 'lm studio', 'ollama', 'otter', 'perplexity', 'warp', 'windsurf', 'wispr flow');",
      "interval": 86400,
      "platform": "windows",
      "description": "Installed Windows programs whose display name is in the AI catalogue (exact name; a display name that carries a version number is not matched). Tables: programs.",
      "snapshot": true,
      "removed": false
    },
    "ai_deb_packages_linux": {
      "query": "SELECT name, version FROM deb_packages WHERE lower(name) IN ('chatgpt', 'claude', 'cursor', 'fireflies', 'grammarly', 'llama-server', 'lms', 'ollama', 'ollama.exe', 'otter', 'perplexity', 'warp', 'windsurf');",
      "interval": 86400,
      "platform": "linux",
      "description": "Debian packages whose name matches an AI app or local runtime name in the catalogue. Tables: deb_packages.",
      "snapshot": true,
      "removed": false
    },
    "ai_rpm_packages_linux": {
      "query": "SELECT name, version FROM rpm_packages WHERE lower(name) IN ('chatgpt', 'claude', 'cursor', 'fireflies', 'grammarly', 'llama-server', 'lms', 'ollama', 'ollama.exe', 'otter', 'perplexity', 'warp', 'windsurf');",
      "interval": 86400,
      "platform": "linux",
      "description": "RPM packages whose name matches an AI app or local runtime name in the catalogue. Tables: rpm_packages.",
      "snapshot": true,
      "removed": false
    },
    "ai_running_processes": {
      "query": "SELECT name, path FROM processes WHERE lower(name) IN ('chatgpt.exe', 'claude', 'claude.exe', 'codex', 'cursor.exe', 'fireflies.exe', 'gemini', 'grammarly.desktop.exe', 'llama-server', 'lms', 'microsoft.copilot', 'ollama', 'ollama.exe', 'otter.exe', 'warp.exe', 'windsurf.exe');",
      "interval": 86400,
      "description": "Running processes whose name is an AI app executable, AI CLI or local runtime in the catalogue. The command line is never selected. Tables: processes.",
      "snapshot": true,
      "removed": false
    },
    "ai_ide_extensions_vscode": {
      "query": "SELECT u.username AS username, lower(e.publisher || '.' || e.name) AS extension_id, e.version AS version, e.vscode_edition AS vscode_edition FROM users u CROSS JOIN vscode_extensions e USING (uid) WHERE lower(e.publisher || '.' || e.name) IN ('anthropic.claude-code', 'codeium.codeium', 'continue.continue', 'github.copilot', 'github.copilot-chat', 'google.geminicodeassist', 'openai.chatgpt', 'rooveterinaryinc.roo-cline', 'saoudrizwan.claude-dev', 'tabnine.tabnine-vscode');",
      "interval": 86400,
      "description": "VS Code-family editor extensions (publisher.name) in the AI catalogue, per local user. Tables: users, vscode_extensions.",
      "snapshot": true,
      "removed": false
    },
    "ai_ide_extensions_jetbrains": {
      "query": "SELECT u.username AS username, p.name AS name, p.version AS version, p.vendor AS vendor, p.product_type AS product_type FROM users u CROSS JOIN jetbrains_plugins p USING (uid) WHERE lower(p.name) IN ('github-copilot');",
      "interval": 86400,
      "description": "JetBrains IDE plugins whose name is in the AI catalogue, per local user. Tables: users, jetbrains_plugins.",
      "snapshot": true,
      "removed": false
    },
    "ai_browser_extensions_chromium": {
      "query": "SELECT u.username AS username, c.browser_type AS browser_type, c.identifier AS identifier, c.name AS name, c.version AS version FROM users u CROSS JOIN chrome_extensions c USING (uid) WHERE lower(c.identifier) IN ('bnmojkbbkkonlmlfgejehefjldooied', 'hlgbcneanomplepojfcnclggenpcoldo', 'kbfnbcaeplbcioakkpcpgfkobkghlhen', 'microsoft-copilot');",
      "interval": 86400,
      "description": "Chromium-family browser extensions (Chrome, Edge and others osquery reads) whose id is in the AI catalogue, per local user. Tables: users, chrome_extensions.",
      "snapshot": true,
      "removed": false
    },
    "ai_local_runtime_listeners": {
      "query": "SELECT p.name AS name, p.path AS path, l.port AS port, l.address AS address, l.protocol AS protocol FROM listening_ports l JOIN processes p USING (pid) WHERE lower(p.name) IN ('llama-server', 'lms', 'ollama', 'ollama.exe') OR l.port IN (11434, 1234);",
      "interval": 86400,
      "description": "Listening sockets owned by a local model runtime, or on a local runtime's default port. The command line is never selected. Tables: listening_ports, processes.",
      "snapshot": true,
      "removed": false
    },
    "ai_cli_npm_global": {
      "query": "SELECT name, version, path FROM npm_packages WHERE lower(name) IN ('@anthropic-ai/claude-code', '@google/gemini-cli', '@openai/codex');",
      "interval": 86400,
      "description": "Globally installed npm packages that are AI CLIs in the catalogue. Tables: npm_packages.",
      "snapshot": true,
      "removed": false
    },
    "ai_cli_binaries_macos": {
      "query": "SELECT path, type FROM file WHERE path LIKE '/usr/local/bin/claude' OR path LIKE '/opt/homebrew/bin/claude' OR path LIKE '/Users/%/.local/bin/claude' OR path LIKE '/Users/%/.npm-global/bin/claude' OR path LIKE '/usr/local/bin/codex' OR path LIKE '/opt/homebrew/bin/codex' OR path LIKE '/Users/%/.local/bin/codex' OR path LIKE '/Users/%/.npm-global/bin/codex' OR path LIKE '/usr/local/bin/gemini' OR path LIKE '/opt/homebrew/bin/gemini' OR path LIKE '/Users/%/.local/bin/gemini' OR path LIKE '/Users/%/.npm-global/bin/gemini' OR path LIKE '/usr/local/bin/llama-server' OR path LIKE '/opt/homebrew/bin/llama-server' OR path LIKE '/Users/%/.local/bin/llama-server' OR path LIKE '/Users/%/.npm-global/bin/llama-server' OR path LIKE '/usr/local/bin/ollama' OR path LIKE '/opt/homebrew/bin/ollama' OR path LIKE '/Users/%/.local/bin/ollama' OR path LIKE '/Users/%/.npm-global/bin/ollama';",
      "interval": 86400,
      "platform": "darwin",
      "description": "AI CLI binaries present in common install directories. Name, path and type only; the file is never read or hashed. Tables: file.",
      "snapshot": true,
      "removed": false
    },
    "ai_cli_binaries_linux": {
      "query": "SELECT path, type FROM file WHERE path LIKE '/usr/local/bin/claude' OR path LIKE '/usr/bin/claude' OR path LIKE '/home/%/.local/bin/claude' OR path LIKE '/home/%/.npm-global/bin/claude' OR path LIKE '/root/.local/bin/claude' OR path LIKE '/usr/local/bin/codex' OR path LIKE '/usr/bin/codex' OR path LIKE '/home/%/.local/bin/codex' OR path LIKE '/home/%/.npm-global/bin/codex' OR path LIKE '/root/.local/bin/codex' OR path LIKE '/usr/local/bin/gemini' OR path LIKE '/usr/bin/gemini' OR path LIKE '/home/%/.local/bin/gemini' OR path LIKE '/home/%/.npm-global/bin/gemini' OR path LIKE '/root/.local/bin/gemini' OR path LIKE '/usr/local/bin/llama-server' OR path LIKE '/usr/bin/llama-server' OR path LIKE '/home/%/.local/bin/llama-server' OR path LIKE '/home/%/.npm-global/bin/llama-server' OR path LIKE '/root/.local/bin/llama-server' OR path LIKE '/usr/local/bin/ollama' OR path LIKE '/usr/bin/ollama' OR path LIKE '/home/%/.local/bin/ollama' OR path LIKE '/home/%/.npm-global/bin/ollama' OR path LIKE '/root/.local/bin/ollama';",
      "interval": 86400,
      "platform": "linux",
      "description": "AI CLI binaries present in common install directories. Name, path and type only; the file is never read or hashed. Tables: file.",
      "snapshot": true,
      "removed": false
    },
    "ai_cli_binaries_windows": {
      "query": "SELECT path, type FROM file WHERE path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\claude.cmd' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\claude.exe' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\codex.cmd' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\codex.exe' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\gemini.cmd' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\gemini.exe' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\llama-server.cmd' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\llama-server.exe' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\ollama.cmd' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\npm\\ollama.exe';",
      "interval": 86400,
      "platform": "windows",
      "description": "AI CLI binaries present in common install directories. Name, path and type only; the file is never read or hashed. Tables: file.",
      "snapshot": true,
      "removed": false
    },
    "ai_env_var_names_posix": {
      "query": "SELECT DISTINCT p.name AS process_name, e.key AS key FROM process_envs e JOIN processes p USING (pid) WHERE e.key IN ('ANTHROPIC_API_KEY', 'ANTHROPIC_AUTH_TOKEN', 'CLAUDE_CODE_OAUTH_TOKEN', 'CODEX_API_KEY', 'CURSOR_API_KEY', 'DEEPSEEK_API_KEY', 'GEMINI_API_KEY', 'GOOGLE_API_KEY', 'HF_TOKEN', 'HUGGINGFACE_API_KEY', 'MISTRAL_API_KEY', 'OPENAI_API_KEY', 'PERPLEXITY_API_KEY');",
      "interval": 86400,
      "platform": "posix",
      "description": "NAMES of AI-related environment variables set in running processes. The value is never selected. Tables: process_envs, processes.",
      "snapshot": true,
      "removed": false
    },
    "ai_env_var_names_windows": {
      "query": "SELECT key, name FROM registry WHERE (key LIKE 'HKEY_USERS\\%\\Environment' OR key = 'HKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Environment') AND name IN ('ANTHROPIC_API_KEY', 'ANTHROPIC_AUTH_TOKEN', 'CLAUDE_CODE_OAUTH_TOKEN', 'CODEX_API_KEY', 'CURSOR_API_KEY', 'DEEPSEEK_API_KEY', 'GEMINI_API_KEY', 'GOOGLE_API_KEY', 'HF_TOKEN', 'HUGGINGFACE_API_KEY', 'MISTRAL_API_KEY', 'OPENAI_API_KEY', 'PERPLEXITY_API_KEY');",
      "interval": 86400,
      "platform": "windows",
      "description": "NAMES of AI-related environment variables in the per-user and system environment registry keys. The value data is never selected. Tables: registry.",
      "snapshot": true,
      "removed": false
    },
    "ai_config_files_macos": {
      "query": "SELECT path, type, mtime FROM file WHERE path LIKE '/Users/%/.claude' OR path LIKE '/Users/%/.claude.json' OR path LIKE '/Users/%/.codex' OR path LIKE '/Users/%/.cursor' OR path LIKE '/Users/%/.cursor/mcp.json' OR path LIKE '/Users/%/.gemini' OR path LIKE '/Users/%/.lmstudio' OR path LIKE '/Users/%/.ollama/models' OR path LIKE '/Users/%/Library/Application Support/Claude/claude_desktop_config.json';",
      "interval": 86400,
      "platform": "darwin",
      "description": "AI assistant and MCP config files or directories present in user homes. Path, type and modification time only; contents are never read or hashed. Tables: file.",
      "snapshot": true,
      "removed": false
    },
    "ai_config_files_linux": {
      "query": "SELECT path, type, mtime FROM file WHERE path LIKE '/home/%/.claude' OR path LIKE '/root/.claude' OR path LIKE '/home/%/.claude.json' OR path LIKE '/root/.claude.json' OR path LIKE '/home/%/.codex' OR path LIKE '/root/.codex' OR path LIKE '/home/%/.config/Claude/claude_desktop_config.json' OR path LIKE '/root/.config/Claude/claude_desktop_config.json' OR path LIKE '/home/%/.cursor' OR path LIKE '/root/.cursor' OR path LIKE '/home/%/.cursor/mcp.json' OR path LIKE '/root/.cursor/mcp.json' OR path LIKE '/home/%/.gemini' OR path LIKE '/root/.gemini' OR path LIKE '/home/%/.lmstudio' OR path LIKE '/root/.lmstudio' OR path LIKE '/home/%/.ollama/models' OR path LIKE '/root/.ollama/models';",
      "interval": 86400,
      "platform": "linux",
      "description": "AI assistant and MCP config files or directories present in user homes. Path, type and modification time only; contents are never read or hashed. Tables: file.",
      "snapshot": true,
      "removed": false
    },
    "ai_config_files_windows": {
      "query": "SELECT path, type, mtime FROM file WHERE path LIKE 'C:\\Users\\%\\.claude' OR path LIKE 'C:\\Users\\%\\.claude.json' OR path LIKE 'C:\\Users\\%\\.codex' OR path LIKE 'C:\\Users\\%\\.cursor' OR path LIKE 'C:\\Users\\%\\.cursor\\mcp.json' OR path LIKE 'C:\\Users\\%\\.gemini' OR path LIKE 'C:\\Users\\%\\.lmstudio' OR path LIKE 'C:\\Users\\%\\.ollama\\models' OR path LIKE 'C:\\Users\\%\\AppData\\Roaming\\Claude\\claude_desktop_config.json';",
      "interval": 86400,
      "platform": "windows",
      "description": "AI assistant and MCP config files or directories present in user homes. Path, type and modification time only; contents are never read or hashed. Tables: file.",
      "snapshot": true,
      "removed": false
    },
    "hidden_assistant_lan_listeners": {
      "query": "SELECT p.name AS name, p.path AS path, l.port AS port, l.address AS address, l.protocol AS protocol FROM listening_ports l JOIN processes p USING (pid) WHERE l.address IN ('0.0.0.0', '::') AND (p.path LIKE '/Users/%' OR p.path LIKE '/home/%' OR p.path LIKE '/tmp/%' OR p.path LIKE '/private/tmp/%' OR p.path LIKE '/var/folders/%' OR p.path LIKE 'C:\\Users\\%');",
      "interval": 86400,
      "description": "Programs run from a user, hidden or temp directory that accept connections on every interface (LAN remote control). A trait lead; the command line is never selected. Tables: listening_ports, processes.",
      "snapshot": true,
      "removed": false
    },
    "hidden_assistant_background_apps_macos": {
      "query": "SELECT name, bundle_identifier, path, element FROM apps WHERE path LIKE '/Users/%' AND (element = '1' OR element = 'true');",
      "interval": 86400,
      "platform": "darwin",
      "description": "User-installed macOS apps that declare themselves background agents (no Dock icon or window). A trait lead. Tables: apps.",
      "snapshot": true,
      "removed": false
    }
  }
}
