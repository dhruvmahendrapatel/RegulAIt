# nfpm config for the endpoint agent's .deb and .rpm (R15 §4.4). Variables come from scripts/package-linux.sh.
# The package installs the binary and a systemd USER unit (the agent never runs as root, R15 call 1), creates the
# empty config directories, and runs the install step (scripts/postinstall.sh) once as root. MDM places
# /etc/regulait-agent/config.json (0644) and /etc/regulait-agent/enrol.json (root:root 0600); neither is packaged.
name: regulait-agent
arch: ${AGENT_ARCH}
platform: linux
version: ${AGENT_VERSION}
section: admin
priority: optional
maintainer: RegulAIt <security@regulait.invalid>
description: RegulAIt endpoint agent. Read-only discovery of AI tools on this device; reports to the organisation's RegulAIt gateway only.
vendor: RegulAIt
license: Proprietary
contents:
  - src: ${AGENT_BIN}
    dst: /usr/bin/regulait-agent
    file_info:
      mode: 0755
  - src: ./regulait-agent.service
    dst: /usr/lib/systemd/user/regulait-agent.service
    file_info:
      mode: 0644
  - dst: /etc/regulait-agent
    type: dir
    file_info:
      mode: 0755
  - dst: /var/lib/regulait-agent
    type: dir
    file_info:
      mode: 0755
scripts:
  postinstall: ./postinstall.sh
  preremove: ./preremove.sh
