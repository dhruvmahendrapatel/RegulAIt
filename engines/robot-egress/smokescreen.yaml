# ADR-0364 S3 — the robot egress proxy's fixed configuration (stripe/smokescreen config file). Per run the executor
# adds only the run's ACL (`--egress-acl-file`, generated by smokescreenAcl in @regulait/shared) and, where needed,
# the listen address; the image's ENTRYPOINT already disables the `open` and `report` ACL actions.
#
# A sandbox presents no client certificate, so no request has a role. Without this switch Smokescreen refuses every
# request ("Client role cannot be determined"); with it, every request is judged by the ACL's `default` rule, the
# run's one `enforce` rule.
allow_missing_role: true
# on top of Smokescreen's own default (every non-public address is refused): the cloud metadata addresses
deny_ranges:
  - 169.254.169.254/32
  - fd00:ec2::254/128
connect_timeout: 10s
