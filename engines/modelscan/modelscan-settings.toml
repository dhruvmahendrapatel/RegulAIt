# ADR-0187 B5-M — modelscan 0.8.8 settings, OURS (G19 "Consequences for B5-M" 4).
#
# Baked read-only into the image at /opt/modelscan/modelscan-settings.toml and ALWAYS passed with
# --settings-file: without it modelscan loads ./modelscan-settings.toml from its working directory,
# and a settings file names the scanner, middleware and report classes it imports, so it can load
# any importable code. The scanner runs from an empty tmpfs working directory as well.
#
# What differs from modelscan's DEFAULT_SETTINGS:
#   - the reporting module is the JSON report (the CLI's `-r json` sets it again);
#   - the middleware's format map names each format by its string value. Stock 0.8.8 cannot read
#     that from a file (its scanners call `.value` on each format, which only its in-code defaults
#     provide), so the image patches one function to resolve the names
#     (engines/modelscan/patches/format-names-from-settings.py, ADR-0187 decision 107). The file
#     modelscan reads is always `artifact<ext>`, the extension chosen by the RUNNER from the file's
#     bytes (packages/shared/src/engines/modelscan.ts), never the uploaded name;
#   - the unsafe-globals deny-list gains the modules and callables G19 measured slipping through
#     (importlib, ctypes, http.client, code, marshal, types, operator.methodcaller, …).
# packages/engine-modelscan/src/settings.test.ts parses this file and compares it with
# MODELSCAN_SETTINGS (packages/engine-modelscan/src/settings.ts): the two never drift.

modelscan_version = "0.8.8"
supported_zip_extensions = [".zip", ".npz"]

[scanners."modelscan.scanners.H5LambdaDetectScan"]
enabled = true
supported_extensions = [".h5"]

[scanners."modelscan.scanners.KerasLambdaDetectScan"]
enabled = true
supported_extensions = [".keras"]

[scanners."modelscan.scanners.SavedModelLambdaDetectScan"]
enabled = true
supported_extensions = [".pb"]

[scanners."modelscan.scanners.SavedModelLambdaDetectScan".unsafe_keras_operators]
Lambda = "MEDIUM"

[scanners."modelscan.scanners.SavedModelTensorflowOpScan"]
enabled = true
supported_extensions = [".pb"]

[scanners."modelscan.scanners.SavedModelTensorflowOpScan".unsafe_tf_operators]
ReadFile = "HIGH"
WriteFile = "HIGH"

[scanners."modelscan.scanners.NumpyUnsafeOpScan"]
enabled = true
supported_extensions = [".npy"]

[scanners."modelscan.scanners.PickleUnsafeOpScan"]
enabled = true
supported_extensions = [".pkl", ".pickle", ".joblib", ".dill", ".dat", ".data"]

[scanners."modelscan.scanners.PyTorchUnsafeOpScan"]
enabled = true
supported_extensions = [".bin", ".pt", ".pth", ".ckpt"]

[middlewares."modelscan.middlewares.FormatViaExtensionMiddleware".formats]
tensorflow = [".pb"]
keras_h5 = [".h5"]
keras = [".keras"]
numpy = [".npy"]
pytorch = [".bin", ".pt", ".pth", ".ckpt"]
pickle = [".pkl", ".pickle", ".joblib", ".dill", ".dat", ".data"]

[unsafe_globals.CRITICAL]
__builtin__ = ["eval", "compile", "getattr", "setattr", "delattr", "apply", "exec", "execfile", "open", "breakpoint", "__import__", "globals", "locals", "vars", "input"]
builtins = ["eval", "compile", "getattr", "setattr", "delattr", "apply", "exec", "open", "breakpoint", "__import__", "globals", "locals", "vars", "input"]
runpy = "*"
os = "*"
nt = "*"
posix = "*"
socket = "*"
subprocess = "*"
sys = "*"
operator = ["attrgetter", "methodcaller"]
pty = "*"
pickle = "*"
_pickle = "*"
bdb = "*"
pdb = "*"
shutil = "*"
asyncio = "*"
importlib = "*"
"importlib.util" = "*"
"importlib.machinery" = "*"
ctypes = "*"
"ctypes.util" = "*"
code = "*"
codeop = "*"
marshal = "*"
types = "*"
multiprocessing = "*"
_posixsubprocess = "*"
cffi = "*"
"torch.hub" = "*"
"torch.utils.cpp_extension" = "*"

[unsafe_globals.HIGH]
webbrowser = "*"
httplib = "*"
"http.client" = "*"
"urllib.request" = "*"
urllib = "*"
ftplib = "*"
smtplib = "*"
telnetlib = "*"
"requests.api" = "*"
requests = "*"
"aiohttp.client" = "*"
aiohttp = "*"
io = ["open", "open_code", "FileIO"]
_io = ["open", "open_code", "FileIO"]
tempfile = "*"
pathlib = "*"
glob = "*"
zipimport = "*"
dill = "*"

[unsafe_globals.MEDIUM]
functools = ["partial", "reduce"]
"numpy.testing._private.utils" = "*"

[unsafe_globals.LOW]

[reporting]
module = "modelscan.reports.JSONReport"

[reporting.settings]
