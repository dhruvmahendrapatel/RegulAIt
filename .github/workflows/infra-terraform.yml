name: Infra Terraform

# ADR-0325: offline checks for the Terraform under infra/. Never touches an AWS
# account: `validate` runs with -backend=false and the module tests run
# plan-only with fake credentials and overridden account lookups.

on:
  pull_request:
    paths:
      - 'infra/modules/**'
      - 'infra/environments/**'
      - 'infra/scripts/install-terraform.sh'
      - '.github/workflows/infra-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'infra/modules/**'
      - 'infra/environments/**'
      - 'infra/scripts/install-terraform.sh'
      - '.github/workflows/infra-terraform.yml'
  workflow_dispatch:

concurrency:
  group: infra-terraform-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: infra / terraform fmt, validate, test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Modules and compositions this workflow checks. Older ones are added as
      # they gain tests; each must init without a backend.
      MODULES: github-oidc-role aws-byoc-deployer-policy
      ENVIRONMENTS: regulait-dev-rehearsal-role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform (pinned, SHA-256 checked)
        run: |
          infra/scripts/install-terraform.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: fmt
        run: terraform fmt -check -recursive infra/modules infra/environments
      - name: validate and test
        run: |
          set -euo pipefail
          for m in $MODULES; do
            echo "::group::module $m"
            (cd "infra/modules/$m" && terraform init -backend=false -input=false && terraform validate && terraform test)
            echo "::endgroup::"
          done
          for e in $ENVIRONMENTS; do
            echo "::group::environment $e"
            (cd "infra/environments/$e" && terraform init -backend=false -input=false && terraform validate)
            echo "::endgroup::"
          done
