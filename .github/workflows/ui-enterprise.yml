name: UI enterprise harness

# ADR-0196. The owner's four "enterprise grade" UI bars, as ratchets in the import-cycle job's model (#387): today's
# violations are in committed baselines that may only shrink; a new violation fails here.
#
#   static       design tokens (scripts/preflight-ui-tokens.mjs, a postcss parse of the CSS + a TSX scan), the
#                baseline guard (no baseline file may grow against the base branch, and no bundle ceiling in
#                apps/web/.size-limit.json may rise, go or change its files), and the JS/CSS bundle ceilings
#                themselves (size-limit, pinned to `--config .size-limit.json`) on the production build; the guard
#                also refuses any other place size-limit could read ceilings from (a package.json key, a second file);
#                and no library's development build in the bundle (scripts/preflight-ui-prod-bundle.mjs).
#   browsers     apps/web/playwright.enterprise.config.ts, one job per browser. Chromium runs every check (axe on
#                every screen in both themes, keyboard journeys, the five viewports, loading/error states, table
#                density, LCP/INP); Firefox and WebKit run the keyboard journeys and the viewports. The browsers
#                are installed here with the Playwright version the lockfile pins.
#   screenshots  the screenshot pack (screen x viewport x theme) and its index.html, uploaded as an artifact for
#                the owner to scan. It asserts nothing.
#
# Everything runs against the built SPA (`vite preview`) and the harness's mocked API: no gateway, database or seed.

# ADR-0252 addendum (owner decision 2026-11-07): on a PR, `static` runs when code changed and the browser and
# screenshot jobs only when the web app changed; a merge group, a push to main and the nightly schedule run all of it.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ui-enterprise-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ADR-0252 addendum: what this run must cover (.github/actions/ci-scope)
  scope:
    name: ui enterprise / scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      full: ${{ steps.scope.outputs.full }}
      code: ${{ steps.scope.outputs.code }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        uses: ./.github/actions/ci-scope

  static:
    name: ui enterprise / tokens, baseline guard, bundle size
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Compared with the PR's base branch; on a schedule or manual run there is nothing to compare with.
      - name: No enterprise baseline grew
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          BASE_REF: ${{ github.base_ref }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          # ADR-0252: in the merge queue, compare with the commit the queued PR is merged onto
          if [ -n "$MG_BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$MG_BASE_SHA"
            base="$MG_BASE_SHA"
          else
            git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            base="origin/$BASE_REF"
          fi
          node scripts/ui-enterprise-baseline.mjs --guard "$base"

      - name: No new hard-coded colour or spacing in apps/web (design-token ratchet)
        if: success() || failure()
        run: node scripts/preflight-ui-tokens.mjs

      - name: Build the web app
        if: success() || failure()
        run: pnpm --filter @regulait/web build

      - name: Bundle-size ceilings (size-limit)
        if: success() || failure()
        run: pnpm --filter @regulait/web exec size-limit --config .size-limit.json

      # ADR-0196 addendum 2026-10-21: the build ships each library's production build, never a development one
      # (apps/web/vite.config.ts swaps the routing library's; React follows NODE_ENV).
      - name: No development build in the bundle
        if: success() || failure()
        run: node scripts/preflight-ui-prod-bundle.mjs

  browsers:
    name: ui enterprise / ${{ matrix.browser }}
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright browsers cached per OS/arch + the exact installed Playwright version
      # (#453; see ci.yml header item 6). Hit: only the apt system packages install.
      - name: Playwright version
        id: playwright
        run: |
          v="$(pnpm --filter @regulait/web exec playwright --version | sed -n 's/^Version \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p')"
          test -n "$v" || { echo "::error::could not read the Playwright version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Runner image for the apt package cache key; a new image carries new package versions.
          img="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          [[ "$img" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected runner image id"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
          # The browser cache key carries the image OS (e.g. ubuntu24), so an Ubuntu release change misses cleanly.
          echo "imageos=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.imageos }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      # The .deb files `install-deps` downloads are cached too (#453): a slow apt mirror stalled them for 9-13 min
      # even on a browser hit. apt still checks every cached file against the signed package index.
      - name: Restore Playwright apt packages
        id: playwright-apt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}

      - name: Seed apt with the cached packages
        env:
          DEBS: ${{ runner.temp }}/playwright-apt
        run: |
          echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99playwright-keep-debs >/dev/null
          if [ -d "$DEBS" ]; then find "$DEBS" -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +; fi
          echo "apt archive holds $(find /var/cache/apt/archives -maxdepth 1 -name '*.deb' | wc -l) packages"

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @regulait/web exec playwright install --with-deps ${{ matrix.browser }}

      # Saved straight after the install, not in a post step, so a later test failure or a timeout still keeps it.
      - name: Save Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @regulait/web exec playwright install-deps ${{ matrix.browser }}

      # Saved on a miss straight after the install, like the browsers. Nothing collected means nothing to save.
      - name: Collect Playwright apt packages (cache miss)
        id: playwright-apt-collect
        if: steps.playwright-apt.outputs.cache-hit != 'true'
        env:
          DEBS: ${{ runner.temp }}/playwright-apt
        run: |
          mkdir -p "$DEBS"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$DEBS" {} +
          n="$(find "$DEBS" -maxdepth 1 -name '*.deb' | wc -l)"
          echo "collected $n packages, $(du -sh "$DEBS" | cut -f1)"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Save Playwright apt packages (cache miss)
        if: steps.playwright-apt.outputs.cache-hit != 'true' && steps.playwright-apt-collect.outputs.count != '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}

      - name: Enterprise harness on ${{ matrix.browser }}
        run: pnpm --filter @regulait/web exec playwright test -c playwright.enterprise.config.ts --project=${{ matrix.browser }} --reporter=list,github

      # What the run found, written as the baseline it would need: the diff in the log shows every new finding,
      # and the artifact holds the raw findings and the measured LCP / INP of every screen.
      - name: Findings as a baseline diff
        if: ${{ !cancelled() }}
        run: |
          node scripts/ui-enterprise-baseline.mjs --stale
          node scripts/ui-enterprise-baseline.mjs --update
          git --no-pager diff --stat -- apps/web/e2e/enterprise/baselines
          git --no-pager diff -- apps/web/e2e/enterprise/baselines

      - name: Findings and measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-enterprise-findings-${{ matrix.browser }}
          path: |
            apps/web/test-results/enterprise-findings
            apps/web/test-results/enterprise-perf.*.jsonl
            apps/web/e2e/enterprise/baselines
          if-no-files-found: warn
          retention-days: 14

  screenshots:
    name: ui enterprise / screenshot pack
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright browser cache (#453; ci.yml header item 6).
      - name: Playwright version
        id: playwright
        run: |
          v="$(pnpm --filter @regulait/web exec playwright --version | sed -n 's/^Version \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p')"
          test -n "$v" || { echo "::error::could not read the Playwright version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Runner image for the apt package cache key; a new image carries new package versions.
          img="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          [[ "$img" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected runner image id"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
          # The browser cache key carries the image OS (e.g. ubuntu24), so an Ubuntu release change misses cleanly.
          echo "imageos=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.imageos }}-${{ steps.playwright.outputs.version }}-chromium

      # The .deb files `install-deps` downloads are cached too (#453): a slow apt mirror stalled them for 9-13 min
      # even on a browser hit. apt still checks every cached file against the signed package index.
      - name: Restore Playwright apt packages
        id: playwright-apt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Seed apt with the cached packages
        env:
          DEBS: ${{ runner.temp }}/playwright-apt
        run: |
          echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99playwright-keep-debs >/dev/null
          if [ -d "$DEBS" ]; then find "$DEBS" -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +; fi
          echo "apt archive holds $(find /var/cache/apt/archives -maxdepth 1 -name '*.deb' | wc -l) packages"

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @regulait/web exec playwright install --with-deps chromium

      # Saved straight after the install, not in a post step, so a later test failure or a timeout still keeps it.
      - name: Save Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @regulait/web exec playwright install-deps chromium

      # Saved on a miss straight after the install, like the browsers. Nothing collected means nothing to save.
      - name: Collect Playwright apt packages (cache miss)
        id: playwright-apt-collect
        if: steps.playwright-apt.outputs.cache-hit != 'true'
        env:
          DEBS: ${{ runner.temp }}/playwright-apt
        run: |
          mkdir -p "$DEBS"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$DEBS" {} +
          n="$(find "$DEBS" -maxdepth 1 -name '*.deb' | wc -l)"
          echo "collected $n packages, $(du -sh "$DEBS" | cut -f1)"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Save Playwright apt packages (cache miss)
        if: steps.playwright-apt.outputs.cache-hit != 'true' && steps.playwright-apt-collect.outputs.count != '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}

      - name: Screenshot pack (every screen x viewport x theme)
        run: pnpm --filter @regulait/web exec playwright test -c playwright.enterprise.config.ts --project=screenshots --reporter=list

      - name: Index page
        if: ${{ !cancelled() }}
        run: node scripts/ui-screenshot-index.mjs

      - name: Upload the pack
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshot-pack
          path: apps/web/test-results/screenshot-pack
          if-no-files-found: error
          retention-days: 30

  # THE CHECK TO REQUIRE for this workflow (ADR-0252 addendum; #734 review finding 3). A job skipped by `if:` counts
  # as passing, so without this a failed `scope` would skip all three jobs and pass. Green only when the scope
  # succeeded and each part either succeeded or was skipped because its own condition was false.
  all:
    name: ui enterprise / all
    needs: [scope, static, browsers, screenshots]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every part ran as its scope required
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '
            def ok(want): if want == "true" then .result == "success" else .result == "skipped" end;
            .scope.outputs as $o |
            .scope.result == "success" and (.static | ok($o.code)) and (.browsers | ok($o.web)) and (.screenshots | ok($o.web))' > /dev/null
