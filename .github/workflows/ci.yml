name: CI

# RE-ENABLED (2026-08-01), replacing the 2026-07-30 pause that was forced by an
# exhausted Actions allowance. The allowance is 2,000 minutes/month, so the
# triggers below are deliberately shaped to fit a month of this project's very
# high commit rate inside it rather than being restored verbatim.
#
# ── How the budget is spent ──────────────────────────────────────────────────
# GitHub bills per JOB, on wall-clock, ROUNDED UP to the whole minute, and
# parallel jobs each bill separately. So the cost of a run is the SUM of its
# jobs, not the longest one. Every knob below exists to keep that sum down:
#
#  1. NO `push:` TRIGGER.  A `pull_request` run already builds the MERGE of head
#     into base, so a green PR is a green main. Re-running the identical content
#     again on push-to-main would roughly double the monthly spend and prove
#     nothing new. Accepted trade-off: a PR validated against an older main can
#     still land a semantic conflict, so refresh the branch before merging when
#     another PR landed in between. `workflow_dispatch` covers "check main now".
#  2. DOCS-ONLY CHANGES SKIP CI ENTIRELY (`paths-ignore`). This repo commits
#     ADRs, STATE.md and session logs constantly; none of it can break a build,
#     and it is a large share of all commits.
#  3. `docker-build` SELF-SKIPS unless files that can actually change the image
#     were touched. It still costs the ~1 minute of runner startup, versus the
#     ~5 it costs to build — so the common source-only PR pays for roughly one
#     job instead of two. A weekly cron builds it unconditionally so the
#     quickstart path cannot rot unnoticed.
#  4. `cancel-in-progress` kills superseded runs when a PR is pushed to again.
#  5. TIGHT `timeout-minutes`. The expensive failure mode is not a slow job, it
#     is a HUNG one billing its full cap; 25 -> 20/12 caps that blast radius.
#     (The 2026-10-10 stopgap of 45 on the unsharded job is gone: every
#     build-and-test job is back to 20 or less now that the gateway is sharded.)
#
# ── Monthly arithmetic (RE-MEASURED 2026-10-02, runs 37050080219 / 37045578961 /
#    37042881890; the 2026-08-01 figures below it were 2.5x stale — CI-03) ───
# Billing rounds each job UP to the whole minute, so bill the rounded figures:
#     build-and-test  11m31s–14m28s -> 13–15 min  (`pnpm -r test` alone ~11.5 min
#                                     for 226 files / 3,175 tests; +~30 s for the object store)
#     docker-build     1m07s -> 2 min  (self-skipped; a real build is ~5 min)
#     PR push                 ~ 15–17 min
#     Weekly (image built unconditionally)  ~20 min x 4  = ~80 min
#     => (2,000 - 80) / 16 ~= 120 PR pushes a month before the allowance is gone.
#   (2026-08-01, run 30700151398: build-and-test 4m23s, PR push 6 min, 325 pushes.)
#   2026-10-03 (F01): the `spa-journeys` job at the bottom adds a third billed
#   job to every run. NOT YET MEASURED — ~6 min is demo.yml's stated figure for
#   its approval-review job, which has the same shape (install, `pnpm -r build`,
#   chromium, one Playwright invocation). On that estimate a PR push is ~21–23
#   min, weekly ~26 x 4 = ~104, => (2,000 - 104) / 22 ~= 86 PR pushes a month.
#   Replace this paragraph with the measured figure after its first runs.
#   2026-10-06 (ADR-0183 2.4): the mocked UI suite left `spa-journeys` for
#   `spa-mock` (mock-ui-shards.yml): three shard jobs that need no build, no
#   database and no gateway, plus a ~1-minute coverage job. Wall clock for the
#   suite drops from ~11.5 min to the slowest shard (~4–5 min here); the billed
#   sum rises by roughly two extra setups (~2–3 min each) and the coverage job,
#   ~6–8 min a PR push. NOT YET MEASURED on a runner — replace with the real
#   figure after the first runs, as above.
#   2026-10-10: the gateway suite (372 files) had pushed build-and-test to
#   20–30+ min, cancelled at a 30-min cap. It is now `vitest --shard=i/4` across
#   four `gateway-tests` jobs, each with its own Postgres and object store; the
#   build, the shared and other package suites and the static pre-flights run
#   once in `build-and-test-base`; `gateway-coverage` proves the split; the
#   aggregate `build-and-test` keeps the required check name.
#     MEASURED locally (4-core dev container shared with other sessions, load
#     average 6–10, so ~2–3x slower than a runner): shards 1–4 = 13.2 / 16.4 /
#     18.8 / 20.9 min wall (shard 4 re-run green: 23.4, load avg 12), 93
#     files each, run one after another. Vitest splits
#     by file COUNT (SHA-1 of the path), not duration: per-file test time was
#     241 / 322 / 323 / 444 s, so the slowest shard carries ~33% of the suite,
#     not 25%. With three shards the slowest would carry ~43%; that is why four.
#     ESTIMATE on a runner (NOT YET MEASURED — replace after the first runs),
#     from ~25 min of serial gateway test time:
#       gateway-tests        ~4 min setup (install, object store, gateway build)
#                            + 5–9 min tests -> 9–13 min each, ~44 min for four
#       build-and-test-base  install + `pnpm -r build` + packages, ~8 min
#       gateway-coverage ~2 min; build-and-test (the aggregate) ~1 min
#     => ~55 billed min for what was one ~25–33 min job, for a wall clock of
#     ~13 min instead of 20–30+. The extra ~20 billed minutes are three more
#     runner setups and the split's own small jobs — the price of a run that
#     finishes inside its cap; at 2,000 min/month, ~25 fewer PR pushes a month.
# Re-measure if the suite grows materially; these are real numbers, not guesses,
# and they should stay that way. The next lever, when a shard nears its 20-min
# cap, is a fifth matrix entry (one more ~4-min setup), not a higher cap.
# If that ceiling is ever actually hit, the next lever is narrowing
# `pull_request` to `types: [ready_for_review]` so draft iterations stop
# billing — NOT taken now, because this repo's agents open drafts and a draft
# that never runs CI is a draft nobody can trust.
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'project-state/**'
      - '.gitignore'
      - 'LICENSE'
  # Weekly health check of `main`. This is what replaces the deleted `push:`
  # trigger: it catches the two things a PR run structurally cannot — a
  # semantic conflict between two PRs that were each green against an older
  # base, and slow rot from the outside world (a moved base image, a yanked
  # transitive dependency) with no commit of ours to blame.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Rapid follow-up pushes cancel the older in-flight run for the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (CodeQL "workflow does not contain permissions"): every job here only
# checks out code and uploads artifacts; nothing writes to the repository, issues, PRs or packages.
permissions:
  contents: read

jobs:
  # ── build-and-test, split (2026-10-10) ─────────────────────────────────────
  # One job ran everything and the gateway suite (372 files, serial against one
  # Postgres) dominated it: ~13 min on 2026-10-02, 20–30+ min by 2026-10-10, and
  # PRs were cancelled at the 30-minute cap while still making progress. It is
  # now four kinds of job:
  #   build-and-test-base  the build, @regulait/shared (alone, with its timing
  #                        project), every other package's tests, and the static
  #                        pre-flights — each run exactly ONCE, here. No services.
  #   gateway-tests        the gateway suite, `vitest --shard=i/N`, one runner,
  #                        Postgres service and object store per shard.
  #   gateway-coverage     proves every gateway test file ran in exactly one shard.
  #   build-and-test       the aggregate: green only when all of the above are.
  #                        It keeps the job name branch protection requires.
  build-and-test-base:
    name: build-and-test / build, packages, static pre-flights
    runs-on: ubuntu-latest
    # A blast-radius cap, not a target (see the arithmetic above). Without the
    # gateway suite this job is install + `pnpm -r build` + the package suites.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm -r build` also typechecks + bundles the React SPA (apps/web),
      # which is the ONLY UI since ADR-0033 deleted the two single-file
      # template-literal shells. The check-ui-syntax.mjs step that used to
      # `node --check` their inline <script> blocks went with them: tsc and
      # vite parse the SPA's real TypeScript, so a UI typo can no longer ship
      # behind a green build.
      - run: pnpm -r build

      # ADR-0186 decision 30 item 3 (B4I-03): @regulait/shared holds the wall-clock budget tests (its `timing`
      # Vitest project, serialized after its parallel `unit` project). It runs on its own first, so nothing on
      # the other cores can stretch those budgets; every other package then runs in parallel as before.
      # `!regulait` keeps the root's own recursive `test` script out of the filter, and `!@regulait/gateway`
      # leaves the gateway to the `gateway-tests` shards below — this job has no database to give it.
      # The shared budget tests therefore no longer share a runner with the gateway suite at all.
      - run: pnpm --filter @regulait/shared test

      # ADR-0189 slice B5 — SPDX 3.0.1 SHACL conformance of renderings MADE BY THE PRODUCT CODE.
      # The product validates every SPDX rendering against the official JSON schema (Ajv, offline); that is
      # necessary but not sufficient (R12 §5: `suppliedBy` -> Tool passes the schema and fails SHACL). This
      # step runs `spdx3-validate` 0.0.7's own schema + SHACL checks through the offline driver:
      #   - the Python closure is hash-locked (`--require-hashes --no-deps`; halo 0.0.31 is built from its pinned sdist), CI only;
      #   - the renderings come from the BUILT @regulait/shared (`render-fixtures.mjs`), one per subject kind,
      #     plus the with-datasets draft and the suppliedBy->Tool negative control, which must FAIL;
      #   - validation runs in a fresh NETWORK NAMESPACE (`sudo unshare --net`, then `setpriv` back to the
      #     runner user), and the driver's `--require-offline` probe refuses to run if any outside TCP
      #     connection succeeds, so a lost isolation fails the step instead of passing silently;
      #   - fail closed: no input (R13), a vendored file off its sha256 pin, a conforming negative control, or
      #     a triple count that differs from `expected-triples.json` all exit non-zero.
      - name: SPDX 3.0.1 SHACL conformance, offline (ADR-0189 B5)
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/spdx3-venv"
          out="$RUNNER_TEMP/spdx3-out"
          python3 -m venv "$venv"
          "$venv/bin/pip" install --disable-pip-version-check --no-deps --require-hashes -r scripts/spdx3/requirements.lock
          node scripts/spdx3/render-fixtures.mjs "$out"
          isolated() { sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups -- "$@"; }
          # R13 proof on the real command line: no document must fail
          if isolated "$venv/bin/python" -I scripts/spdx3/run_offline.py --require-offline; then
            echo "run_offline.py accepted an empty document list"; exit 1
          fi
          isolated "$venv/bin/python" -I scripts/spdx3/run_offline.py --require-offline \
            --expect scripts/spdx3/expected-triples.json "$out"/*.json

      - run: pnpm -r --filter '!@regulait/shared' --filter '!regulait' --filter '!@regulait/gateway' test
        env:
          # 64-hex test-fixture key, same shape secrets.ts asserts. Not a secret.
          REGULAIT_DATA_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      # B9c — THE AFFORDANCE CENSUS, AS A GATE.
      #
      # `scripts/preflight-ui-affordances.mjs` compares the gateway's DELETE
      # routes against the controls the SPA actually renders, and the POST routes
      # against the lists it shows. It was written during a UI-completeness sweep
      # and deliberately NOT wired in, for the one honest reason: it exited 1. A
      # check that fails on arrival is a check somebody disables.
      #
      # It exits 0 as of this commit — 53 of 53 DELETE routes reachable, no
      # collection the UI lists without a way to add to it — so it becomes a
      # gate now, which is the only way the property survives. The failure it
      # prevents is specific and has happened repeatedly in this repo: an
      # endpoint ships, the list that shows its objects ships, and the control
      # that removes one does not. Access could be granted from the portal and
      # only taken back with a database client; saved views existed for a year
      # with no screen; a training backend announced "will refuse every job" and
      # offered no way to configure one. Each was found by a human reading the
      # product, which is not a mechanism.
      #
      # It is STATIC — it reads route registrations and TSX sources, needs no
      # database and no build — so it sits in this job purely to avoid a second
      # runner startup. Exit 1 means a gap, exit 2 means the script could not
      # run; both fail the job. An intentional API-only route is declared in
      # `DELIBERATELY_API_ONLY` inside the script, with a reason, rather than by
      # loosening this step.
      - name: Pre-flight — every governed object the UI lists can be added and removed from it (B9c)
        run: node scripts/preflight-ui-affordances.mjs

      # AgentCoordination.md stays a CURRENT-STATE file: one Live-status row per
      # agent, one Status line per task, inboxes acked within 12h, a line
      # budget. History lives in git. `pnpm checkin` is the only writer of a row.
      #
      # The same step runs every `scripts/*.test.mjs` — `--dir scripts` scopes
      # discovery to this directory, so an untracked nested checkout on a
      # developer machine is never swept in. That includes the G10-G15-VERIFY
      # guard (`basename-collisions.test.mjs`): no two tracked files in one
      # directory may differ only by case or extension, because an
      # extensionless import of either one breaks the build on a Windows
      # (case-insensitive) checkout while every Linux gate stays green.
      - name: Coordination file lint (structure only — never agent staleness) + repo filename guard
        run: |
          node scripts/coordination.mjs lint
          pnpm exec vitest run --dir scripts

  gateway-tests:
    name: gateway shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # A blast-radius cap, not a target: the slowest shard plus setup is well
    # under it (see the arithmetic above). If a shard nears it, add a shard to
    # the matrix rather than raising this — the coverage job checks any layout.
    timeout-minutes: 20
    strategy:
      # one failing shard must not cancel the others: the coverage job needs
      # every report, and a cancelled shard hides which files it would have run
      fail-fast: false
      matrix:
        # SHARD COUNT: see the arithmetic at the top. `--shard` takes the total
        # from strategy.job-total, so adding an entry here is the whole change.
        #
        # HOW VITEST SPLITS: by FILE, after sorting the files by a SHA-1 of their
        # path (BaseSequencer.shard), into equal-COUNT slices — not by duration.
        # Each shard then runs its files serially (`fileParallelism: false` in
        # apps/gateway/vitest.config.ts), on its own fresh database. ORDER: on a
        # fresh runner there is no Vitest results cache, so a shard runs its
        # files in that SHA-1 order — NOT the unsharded order, and a new file
        # moves the slice boundaries. A test that only passes because another
        # file wrote rows to the shared database first is therefore a defect the
        # split can expose: zz-adr0185-g5-metrics.test.ts was one (its real boot
        # met another file's ciphertexts) and now uses its own scratch database,
        # as the other boot tests do. The layout is deterministic, so such a
        # failure reproduces locally with the same --shard=i/N.
        #
        # TIMING: the gateway has no wall-clock budget tests of the
        # `@regulait/shared` `timing` kind (those run once, alone, in
        # build-and-test-base). Its few elapsed-time assertions are
        # deadline upper bounds (a timeout fires within N ms) and each shard
        # runs alone on its runner, so they see LESS load than they did when the
        # gateway shared `pnpm -r test`'s parallelism with every other package.
        shard: [1, 2, 3, 4]


    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: regulait_test
        ports:
          - 5432:5432
        # NOTE: everything under `options:` is folded into one string and passed
        # VERBATIM to `docker create` — a `#` in there is not a comment, it is
        # an argument, and docker fails with "invalid reference format". Keep
        # commentary out here, above the block.
        #
        # `-d` is not optional: pg_isready with no -d defaults the dbname to the
        # USERNAME, so it dials a database called `regulait` that does not exist
        # (POSTGRES_DB is regulait_test) and the server logs
        # `FATAL: database "regulait" does not exist` every 5s. The probe still
        # passes, so it is harmless — but it is red noise that actively misleads
        # anyone reading the log during an investigation.
        options: >-
          --health-cmd "pg_isready -U regulait -d regulait_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://regulait:regulait@localhost:5432/regulait_test
      # ADR-0181: the gateway's defaults are strict. CI's Postgres service has
      # no TLS, so the database hop is relaxed EXPLICITLY here (the default is
      # `require`), and the scheduler (ON by default) is switched off so no
      # tick loop runs underneath a test.
      REGULAIT_DATABASE_SSL: disable
      REGULAIT_SCHEDULER: 'off'
      # CI-01: when this is SET and a signed ListBuckets against it fails,
      # audit-chain.test.ts throws rather than skips — a broken object-store
      # service (or a wrong credential) fails the job out loud.
      REGULAIT_TEST_S3_ENDPOINT: http://localhost:9000
      REGULAIT_TEST_S3_ACCESS_KEY_ID: regulait
      REGULAIT_TEST_S3_SECRET_ACCESS_KEY: regulait-dev-objectstore


    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # CI-01 — the ADR-0060 "proof by attack" tests need a REAL Object-Lock
      # bucket. They are `describe.skipIf(!s3TestReachable)`, and with no
      # object store here they had skipped on every CI run since they were
      # written: the tamper-resistance claim shipped green on nine tests that
      # never ran.
      #
      # SeaweedFS (Apache-2.0, ADR-0183 §3) replaced the frozen
      # `bitnamilegacy/minio` build after the ADR-0060 suite passed 9/9 against
      # it locally (PENDING.md, "Dev/CI object store after MinIO").
      #
      # Started FROM docker-compose.yml, not as a `services:` entry: a service
      # cannot pass a command, so it would run the image's default `mini` and
      # none of the compose service's settings — the loopback-only filer, the
      # per-boot signing key that closes the S3 gRPC identity API, one volume
      # per bucket and the explicit slot count. This way CI tests exactly the
      # store a `docker compose up` gets, and its bucket-init job too. The only
      # CI addition is publishing S3 on the runner's loopback (compose
      # publishes no port), so the endpoint below stays localhost:9000.
      - name: Object store — the compose `objectstore` service, plus its bucket init
        # BOTH commands must see the same compose files. `run` without the port
        # override sees a different `objectstore` config and RECREATES it with no
        # published port: the init job still works over the compose network, and
        # the suite then finds nothing on localhost:9000 (PR #133, 23:12:05).
        run: |
          printf 'services:\n  objectstore:\n    ports: ["127.0.0.1:9000:9000"]\n' > "$RUNNER_TEMP/ci-objectstore.yml"
          export COMPOSE_FILE="docker-compose.yml:$RUNNER_TEMP/ci-objectstore.yml"
          docker compose up -d --wait objectstore || { docker compose logs objectstore; exit 1; }
          docker compose run --rm objectstore-init
          # what the suite needs: S3 answering on the runner's loopback (an
          # unsigned request is refused 403, which still proves the listener)
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:9000/) || code=000
          [ "$code" != 000 ] || { echo "object store not reachable on 127.0.0.1:9000 after init" >&2; docker compose ps -a; exit 1; }

      # The gateway suite imports its workspace dependencies from their dist/
      # (each package.json `main`) and some tests run the BUILT gateway
      # (dist/seed.js), so the shard builds the gateway and its dependencies —
      # not apps/web. Type-checking the whole repo is build-and-test-base's job.
      - name: Build the gateway and its workspace dependencies
        run: pnpm --filter "@regulait/gateway..." build

      - name: Gateway suite, shard ${{ matrix.shard }} of ${{ strategy.job-total }}
        run: >-
          pnpm --filter @regulait/gateway exec vitest run --dir src
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=default --reporter=github-actions --reporter=json
          --outputFile.json="$RUNNER_TEMP/gateway-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}.json"
        env:
          # 64-hex test-fixture key, same shape secrets.ts asserts. Not a secret.
          REGULAIT_DATA_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      # always (not on a cancelled run): the coverage job needs a failing
      # shard's report too, or it cannot say which files that shard ran
      - name: Shard report for the coverage check
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gateway-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/gateway-shard-${{ matrix.shard }}-of-${{ strategy.job-total }}.json
          if-no-files-found: error
          retention-days: 3

      # SHARDED (2026-10-10): this pre-flight runs in EVERY shard, after that
      # shard's tests, on that shard's database. It is the one pre-flight that
      # is not "exactly once": its value is the rows the suite wrote (point 2
      # below), and each shard's database now holds only its slice of them. Run
      # once it would scan a quarter of the suite's rows (or, in a job of its
      # own, an empty database); run per shard the union is the whole suite,
      # as before. Cost: ~1 s per shard, no extra runner.
      #
      # ADR-0110 — the deferred-unique PRE-FLIGHT, as a real gate.
      #
      # ADR-0109 shipped `scripts/preflight-unique-constraints.mjs` and said so
      # in its own honest-limits section: "The pre-flight is not wired into any
      # deploy path... A check nobody runs is worth nothing." Nothing ran it.
      # This step is that sentence being paid off. It exits 0 clean, 1 when a
      # duplicate would block one of migration 0108/0109's constraints, and 2 if
      # it could not run at all — any non-zero fails the job.
      #
      # WHY IT RUNS *AFTER* the tests, NOT BEFORE:
      #  1. It needs a MIGRATED database and the suite is what migrates one —
      #     every gateway test file calls `runMigrations` on boot. Putting the
      #     check first would mean adding a separate migrate step (a second way
      #     to apply migrations, kept in sync by hand) for no gain.
      #  2. On an empty freshly-migrated database every check is trivially zero
      #     and proves nothing. After the suite the tables hold rows the
      #     PRODUCT'S OWN WRITE PATHS wrote — which is exactly ADR-0109's
      #     argument that "the stronger measurement is the suite itself". This
      #     is the only moment in CI when the scan has anything to scan.
      #  3. It is where an ADVISORY check would earn its keep: a check for a
      #     constraint not yet added (`enforced: false`) describes duplicates
      #     the database still permits, and only a scan over real rows finds
      #     them. There are none today — ADR-0110 promoted the last one,
      #     `backup_runs`, to enforced — and that is stated rather than implied.
      #
      # It also does the one thing nothing else does: EXECUTE the script. It is
      # the only caller in the repo, so without this a broken import into
      # packages/db/dist or a renamed export would go unnoticed indefinitely.
      #
      # Cost: a step inside an existing job, so no extra runner startup — ten
      # read-only GROUP BY scans over small tables, ~1 second. The budget
      # arithmetic at the top of this file does not move.
      - name: Pre-flight — duplicates that would block a unique constraint (ADR-0109/0110)
        run: node scripts/preflight-unique-constraints.mjs "$DATABASE_URL"

  gateway-coverage:
    name: gateway / every test file ran exactly once
    needs: gateway-tests
    # runs when a shard failed too, so a red run still says whether the shards
    # covered the suite; it does not run on a cancelled (superseded) run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      # `vitest list --filesOnly` only resolves the include globs: no build, no
      # database, no test code executed. It also IGNORES --shard (measured on
      # Vitest 4.1.11), so it is the unsharded list by construction.
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: gateway-report-*
          path: ${{ runner.temp }}/shards
          merge-multiple: true

      - name: Unsharded list of gateway test files
        run: pnpm --filter @regulait/gateway exec vitest list --dir src --filesOnly --json="$RUNNER_TEMP/gateway-list.json"

      # Every listed file ran in exactly one shard, no shard ran an unlisted
      # file, and every shard 1..N reported (the shard is read from the report's
      # file name). scripts/vitest-shard-coverage.mjs, with its own tests in
      # scripts/ (run by build-and-test-base).
      - name: Every gateway test file ran in exactly one shard
        run: node scripts/vitest-shard-coverage.mjs --root apps/gateway "$RUNNER_TEMP/gateway-list.json" "$RUNNER_TEMP"/shards/gateway-shard-*.json

  # THE REQUIRED CHECK. Branch protection on `main` requires a check named
  # `build-and-test` (project-state/sessions/2026-07-24-session-02.md); this job
  # keeps that name so the split needs no settings change. It is green only
  # when every part is: a SKIPPED required check counts as passing, so this
  # runs whenever a dependency failed (`!cancelled()`, not the default
  # `success()`, which would skip it) and checks each result itself.
  build-and-test:
    needs: [build-and-test-base, gateway-tests, gateway-coverage]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every part of build-and-test passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'length == 3 and all(.[]; .result == "success")' > /dev/null

  docker-build:
    # The quickstart path must never rot: prove the compose image still builds.
    #
    # But it only rots when something the image is made of changes, so on a PR
    # this job first asks whether any such file moved and skips the ~5-minute
    # build if not — paying ~1 minute of runner startup instead. On schedule and
    # on workflow_dispatch it always builds, which is what stops a slow rot
    # (e.g. a base-image tag going stale) from hiding behind untouched files.
    #
    # Deliberately NOT `dorny/paths-filter` or `tj-actions/changed-files`: a
    # third-party action in the CI path is a supply-chain surface, and native
    # `paths:` filters are workflow-level only, not per-job.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # For a pull_request the checked-out commit is the MERGE commit, so
          # HEAD^1 is the base and `HEAD^1..HEAD` is exactly the PR's diff.
          # Depth 2 is all that needs fetching for that.
          fetch-depth: 2

      - id: scope
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a PR (${{ github.event_name }}) — building unconditionally."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "Changed files:"; echo "$changed"
          # Anything that can alter the produced image: the recipe itself, the
          # compose stack, the ignore file that decides the build context, the
          # lockfile, and every package manifest in the workspace.
          if printf '%s\n' "$changed" | grep -qE '^(Dockerfile|docker-compose\.yml|\.dockerignore|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|(apps|packages)/[^/]+/package\.json)$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image-relevant file changed — skipping the build to save CI minutes."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.scope.outputs.build == 'true'
        run: docker build -t regulait-gateway:ci .

  # F01 — the two SPA journeys that had no gate at all. `phase1.spec.ts` (the
  # developer persona: sign-in with a one-time password, chat, runs, workflows,
  # inbox, projects, goal decomposition, PM links, decision ledger, self-scoped
  # spend, BYO keys) and `phase2.spec.ts` (the admin persona across every
  # native admin view) ran only when a human remembered to run them. Modelled
  # on demo.yml's `approval-review` job: the same global-setup creates its own
  # scratch database from E2E_PG, seeds it through the real API and boots the
  # built gateway serving the built SPA, so nothing here is mocked. A browser
  # job in its own runner so a journey failure is attributable on sight and
  # the unit job's wall clock does not move. Budget: ~6 billed minutes a run
  # (install + build dominate), on the same `pull_request` paths-ignore as the
  # rest of this workflow.
  spa-journeys:
    runs-on: ubuntu-latest
    # 12, down from 20 (ADR-0183 2.4): the serial mocked suite (~11.5 min on
    # 2026-10-05) moved to the sharded `spa-mock` job below, leaving ~4 min of
    # install, build and the four real-gateway journeys. A blast-radius cap.
    # 16 since ADR-0186 (Batch 4): the journeys now step up with TOTP before
    # protected writes, and each step-up waits for a fresh 30 s code (a code is
    # never replayed), so the 47 journeys take ~9.6 min on the runner and the
    # job ~12.5 min with install and build. Raised once; a further rise means
    # something got slower and is a finding.
    timeout-minutes: 16

    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: regulait
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait -d regulait"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_PG: postgres://regulait:regulait@localhost:5432
      # ADR-0181: the gateway's defaults are strict. CI's Postgres service has
      # no TLS, so the database hop is relaxed EXPLICITLY here (the default is
      # `require`), and the scheduler (ON by default) is switched off so no
      # tick loop runs underneath a test.
      REGULAIT_DATABASE_SSL: disable
      REGULAIT_SCHEDULER: 'off'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm --filter @regulait/web exec playwright install --with-deps chromium

      # phase6-agent-builder (ADR-0172) and phase6-builder-tools (ADR-0173 §1, governed tool use against a real MCP server): a non-admin builds an agent from a
      # template, chats with it through the governed core, hits its spend
      # limit; an admin reads Agent usage; the /models portal runs a model.
      - name: SPA journeys — developer (phase1), admin (phase2) and agent builder (phase6) personas
        run: pnpm --filter @regulait/web exec playwright test e2e/phase1.spec.ts e2e/phase2.spec.ts e2e/phase6-agent-builder.spec.ts e2e/phase6-builder-tools.spec.ts --reporter=list,github

      # The artifact below needs a download; this puts the page snapshot at the
      # failure and the gateway's last lines straight into the job log.
      - name: Print the failure context
        if: failure()
        run: |
          find apps/web/test-results -name error-context.md -exec sh -c 'echo "== $1"; cat "$1"' _ {} \; || true
          # public repo, public log: drop anything credential-shaped even though the run is synthetic
          echo "== gateway-e2e.log (last 120 lines, credential-like lines dropped)"
          tail -n 120 apps/web/e2e/gateway-e2e.log | grep -viE "password|token|secret|key|bearer|cookie" || true

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spa-journeys-failure
          path: |
            apps/web/test-results
            apps/web/e2e/gateway-e2e.log
          retention-days: 7

  # The mocked UI suite (every *.mock.spec.ts: the intake wizard's retry and
  # start-over journeys, the axe scans of each intake stage in both themes,
  # the registry, the use-case record, the review panel and the admin pages).
  # It needs no gateway — Vite plus route mocks. ADR-0183 2.4: sharded across
  # parallel jobs, with a final job proving every listed spec ran exactly once;
  # the layout and the proof live in mock-ui-shards.yml, shared with demo.yml.
  spa-mock:
    uses: ./.github/workflows/mock-ui-shards.yml
    with:
      artifact-prefix: ci-mock
