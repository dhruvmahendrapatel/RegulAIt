name: CI

# PAUSED (2026-07-30): the account's GitHub Actions minutes are exhausted, so
# every auto-triggered run instant-fails (log download 404s) before any step —
# pure red noise on PRs. Triggers are set to manual-only (workflow_dispatch)
# until minutes are topped up. Local verification (`pnpm -r build`,
# `node scripts/check-ui-syntax.mjs`, `pnpm -r test`) is the gate meanwhile.
# TO RE-ENABLE: restore the `pull_request:` and `push: branches: [main]` triggers
# below (they are kept commented for a clean revert).
on:
  workflow_dispatch:
  # pull_request:
  # push:
  #   branches: [main]

# Rapid follow-up pushes cancel the older in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: regulait_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://regulait:regulait@localhost:5432/regulait_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # The two single-file UIs are template-literal HTML strings — tsc never
      # parses their inline JS, so a typo ships a blank page with a green
      # build. This extracts the rendered <script> blocks and node --checks them.
      - run: node scripts/check-ui-syntax.mjs

      - run: pnpm -r test
        env:
          # 64-hex test-fixture key, same shape secrets.ts asserts. Not a secret.
          REGULAIT_DATA_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  docker-build:
    # The quickstart path must never rot: prove the compose image still builds.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t regulait-gateway:ci .
