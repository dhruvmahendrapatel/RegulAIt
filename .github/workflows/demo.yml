name: Demo journey

# The AI-intake demo (2026-10-05) end to end, in a real browser, on a real
# database: `demo:prepare` on an empty Postgres → the gateway → the seeded-DB
# Playwright journey (register from shadow AI → independent approval → alert →
# remediation approved by a second person → graph → regulatory → signed audit
# export). The mocked UI suite runs in ci.yml's `spa-mock` on pull requests,
# and here (`demo-mock`, sharded) only on a manual dispatch — see that job.
#
# BUDGET (see ci.yml's header): demo-journey is ~6 billed minutes (install +
# build dominate). A `pull_request` path filter matches the PR's WHOLE diff, so on a
# long-lived PR it would fire on every push — hourly board check-ins included.
# The `changes` job (one billed minute) therefore diffs THIS push against the
# previous head and the journey runs only when demo code changed in it; it
# always runs on `workflow_dispatch`.
on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/gateway/src/demo-*'
      - 'apps/gateway/src/use-cases.ts'
      - 'apps/gateway/src/governance-monitor.ts'
      - 'apps/gateway/src/remediation.ts'
      - 'apps/gateway/src/deploy-gate.ts'
      - 'apps/gateway/src/shadow-ai.ts'
      # #522 finding 21: the Shadow AI remediation, discovery and workflow-engine paths
      - 'apps/gateway/src/shadow-ai-remediation.ts'
      - 'apps/gateway/src/discovery-*.ts'
      - 'apps/gateway/src/workflows.ts'
      # AER-040: the consent-binding path and the signed-export path (beat 3E)
      - 'apps/gateway/src/app.ts'
      - 'apps/gateway/src/mcp-proxy.ts'
      - 'apps/gateway/src/governed-evaluate.ts'
      - 'apps/gateway/src/export-bundle.ts'
      - 'apps/gateway/src/reporting.ts'
      - 'packages/shared/src/**'
      - 'packages/db/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN (CodeQL "workflow does not contain permissions"): every job here only
# checks out code and uploads artifacts; nothing writes to the repository, issues, PRs or packages.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      demo: ${{ steps.diff.outputs.demo }}
      review: ${{ steps.diff.outputs.review }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "demo=true" >> "$GITHUB_OUTPUT"; echo "review=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # ADR-0144 approver-review journeys (AER-040): the approval UI and the kit it
          # is built on (the review dialog is a kit Modal), the
          # proxy/evaluation that binds consent, and the shared binding code
          if git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -qE '^(apps/web/src/(views/(approvals|inbox)/|api/|ui/)|apps/web/e2e/(mcp-action-review|zz-zz-zz-zz-zz-zz-zz-zz-approvals-filter)\.spec\.ts|apps/gateway/src/(mcp-proxy|governed-evaluate|app)\.ts|packages/shared/src/approval-binding\.ts|packages/db/|\.github/workflows/demo\.yml)'; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$BEFORE" "$HEAD_SHA" | grep -qE '^(apps/web/|apps/gateway/src/(demo-|use-cases\.ts|governance-monitor\.ts|remediation\.ts|deploy-gate\.ts|shadow-ai\.ts|shadow-ai-remediation\.ts|discovery-[^/]*\.ts|workflows\.ts|app\.ts|export-bundle\.ts|reporting\.ts)|packages/shared/src/|packages/db/|\.github/workflows/demo\.yml)'; then
            echo "demo=true" >> "$GITHUB_OUTPUT"
          else
            echo "demo=false" >> "$GITHUB_OUTPUT"
          fi

  demo-journey:
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    # job-level, not workflow-level: a later push that skips the journey (docs,
    # board check-ins) never enters this group, so it cannot cancel a journey
    # that is already running; a later push that runs it does
    concurrency:
      group: demo-journey-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # 12, down from 30 (ADR-0183 2.4). Measured 2026-10-06 (ADR-0182, D4 specs):
    # the job reached 20m02s, of which the serial mocked suite was 16.0 min
    # (261 tests), so everything else — install, build, demo:prepare, the
    # gateway and the real journey — was ~4 min. The mocked suite now runs in
    # `demo-mock` below, sharded; this cap is ~4 min plus margin for a slow
    # runner. It is a blast-radius cap: re-measure before raising it.
    # +4 (2026-10-18, ADR-0197) for the demo-screens step: ~30 full-page shots and two TOTP sign-ins, estimated
    # 2-3 min; re-measure from its first green run.
    timeout-minutes: 16

    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: regulait_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait -d regulait_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://regulait:regulait@localhost:5432/regulait_demo
      # the gateway's deploy-time token (the journey signs personas in with the
      # credentials demo:prepare printed, not with this token — B4S-06)
      REGULAIT_BOOTSTRAP_TOKEN: e2e-bootstrap-token
      # 64-hex test-fixture key, same shape secrets.ts asserts. Not a secret.
      REGULAIT_DATA_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      REGULAIT_EPHEMERAL_LICENSE: '1'
      E2E_BASE_URL: http://127.0.0.1:3105
      # ADR-0181: the CI Postgres service has no TLS, so the demo relaxes the
      # database hop EXPLICITLY, exactly as the local demo and docker-compose
      # do (the default is `require`). The gateway prints a loud boot warning
      # and GET /v1/org/posture reports `databaseTls: relaxed`.
      REGULAIT_DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # beat 3E downloads a SIGNED bundle: the deployment's export key (ADR-0116), set for every later step
      - name: Demo export-signing key
        run: pnpm -s --filter @regulait/gateway demo:export-key -- --env | sed -e "s/^export //" -e "s/'//g" >> "$GITHUB_ENV"
        env:
          REGULAIT_DEMO_KEY_DIR: ${{ runner.temp }}/demo-keys

      # B4S-06: the bootstrap token re-provisions nobody once the seed enrolled Ada's
      # authenticator; the journey signs the personas in with the one-time
      # passwords and the authenticator secret demo:prepare prints ONCE (already in
      # this job's log), read from a copy of that output (E2E_DEMO_PREPARE_LOG)
      # ADR-0197 decision 7: the fallback dataset enrols an endpoint device through the real SD4b routes, which need
      # this deployment's public URL and an identity issuer key, as a real install has. Scoped to demo:prepare (and
      # the installer step that makes the key), so the journey's gateway below runs exactly as before.
      - name: Identity issuer key (installer step)
        run: pnpm --filter @regulait/gateway identity-key:init
        env:
          REGULAIT_INSTALL_SECRETS_DIR: ${{ runner.temp }}/install-secrets

      - name: demo:prepare (empty database → demo:check, endpoint agent included)
        run: |
          set -o pipefail
          pnpm --filter @regulait/gateway demo:prepare | tee "$RUNNER_TEMP/demo-prepare.log"
        env:
          REGULAIT_LICENSE_KEYRING: ${{ runner.temp }}/license-keys
          REGULAIT_INSTALL_SECRETS_DIR: ${{ runner.temp }}/install-secrets
          REGULAIT_PUBLIC_URL: http://127.0.0.1:3105

      - name: Start the gateway
        run: |
          PORT=3105 REGULAIT_AUTH_RATE_LIMIT_MAX=1000 REGULAIT_RATE_LIMIT_MAX=20000 \
            nohup node apps/gateway/dist/main.js > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3105/health && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/gateway.log"; exit 1
        env:
          REGULAIT_LICENSE_KEYRING: ${{ runner.temp }}/license-keys

      # Playwright browsers cached per OS/arch + the exact installed Playwright version
      # (#453; see ci.yml header item 6). Hit: only the apt system packages install.
      - name: Playwright version
        id: playwright
        run: |
          v="$(pnpm --filter @regulait/web exec playwright --version | sed -n 's/^Version \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p')"
          test -n "$v" || { echo "::error::could not read the Playwright version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Runner image for the apt package cache key; a new image carries new package versions.
          img="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          [[ "$img" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected runner image id"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
          # The browser cache key carries the image OS (e.g. ubuntu24), so an Ubuntu release change misses cleanly.
          echo "imageos=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.imageos }}-${{ steps.playwright.outputs.version }}-chromium

      # The .deb files `install-deps` downloads are cached too (#453): a slow apt mirror stalled them for 9-13 min
      # even on a browser hit. apt still checks every cached file against the signed package index.
      - name: Restore Playwright apt packages
        id: playwright-apt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Seed apt with the cached packages
        env:
          DEBS: ${{ runner.temp }}/playwright-apt
        run: |
          echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99playwright-keep-debs >/dev/null
          if [ -d "$DEBS" ]; then find "$DEBS" -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +; fi
          echo "apt archive holds $(find /var/cache/apt/archives -maxdepth 1 -name '*.deb' | wc -l) packages"

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @regulait/web exec playwright install --with-deps chromium

      # Saved straight after the install, not in a post step, so a later test failure or a timeout still keeps it.
      - name: Save Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @regulait/web exec playwright install-deps chromium

      # Saved on a miss straight after the install, like the browsers. Nothing collected means nothing to save.
      - name: Collect Playwright apt packages (cache miss)
        id: playwright-apt-collect
        if: steps.playwright-apt.outputs.cache-hit != 'true'
        env:
          DEBS: ${{ runner.temp }}/playwright-apt
        run: |
          mkdir -p "$DEBS"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$DEBS" {} +
          n="$(find "$DEBS" -maxdepth 1 -name '*.deb' | wc -l)"
          echo "collected $n packages, $(du -sh "$DEBS" | cut -f1)"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Save Playwright apt packages (cache miss)
        if: steps.playwright-apt.outputs.cache-hit != 'true' && steps.playwright-apt-collect.outputs.count != '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}

      - name: Real seeded-database journey
        id: journey
        run: pnpm --filter @regulait/web exec playwright test -c playwright.demo-real.config.ts --reporter=list,github
        env:
          E2E_DEMO_PREPARE_LOG: ${{ runner.temp }}/demo-prepare.log

      # ADR-0197: the 2026-11-01 demo's populated-state screenshot pack and its automated QA pass, in script order
      # (Shadow AI first, Morgan's remediation sign-off, then governance), on the database the journey above leaves.
      # A separate spec and config, so the journey is unchanged; it runs even when the journey failed, so a red run
      # still shows every screen it can reach.
      - name: Demo screens (2026-11-01 script)
        if: ${{ !cancelled() && steps.journey.outcome != 'skipped' }}
        run: pnpm --filter @regulait/web exec playwright test -c playwright.demo-screens.config.ts --reporter=list,github
        env:
          E2E_DEMO_PREPARE_LOG: ${{ runner.temp }}/demo-prepare.log

      - name: Keep the demo screens (every run)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-screens
          path: apps/web/e2e/artifacts/demo-screens
          if-no-files-found: warn
          # 30: a pack captured two weeks before the demo still exists on the day (the screens are not committed)
          retention-days: 30

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-journey-failure
          path: |
            apps/web/test-results
            apps/web/e2e/artifacts/demo/real-*.png
            ${{ runner.temp }}/gateway.log
          retention-days: 7

  # ADR-0197 addendum decision 3 (owner, 2026-10-19: option A): the live database holds real findings only.
  # `demo:prepare --live` on an empty database, twice: (1) with nothing before it, so `seed` is the first step and
  # does its first-admin-setup acts (Morgan's creation, both admins' TOTP) without the dataset's setup phase; there
  # the ONLY failing beat is "1 Real discovery sources", since no real source exists yet; (2) with one real source
  # (an endpoint agent, which needs no credential) added and enabled in first-admin setup first, where
  # `demo:check --live` must pass with 0 fail. Both then prove the fictional dataset absent straight from the tables.
  demo-live:
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    concurrency:
      group: demo-live-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: regulait_live
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait -d regulait_live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG: postgres://regulait:regulait@localhost:5432
      REGULAIT_BOOTSTRAP_TOKEN: e2e-bootstrap-token
      # 64-hex test-fixture key, same shape secrets.ts asserts. Not a secret.
      REGULAIT_DATA_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      REGULAIT_EPHEMERAL_LICENSE: '1'
      # ADR-0181: the CI Postgres service has no TLS (see demo-journey)
      REGULAIT_DATABASE_SSL: disable

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - name: Demo export-signing key
        run: pnpm -s --filter @regulait/gateway demo:export-key -- --env | sed -e "s/^export //" -e "s/'//g" >> "$GITHUB_ENV"
        env:
          REGULAIT_DEMO_KEY_DIR: ${{ runner.temp }}/demo-keys

      - name: Second empty database
        run: psql "$PG/regulait_live" -v ON_ERROR_STOP=1 -c "create database regulait_live_sourced"

      - name: demo:prepare --live, nothing before it (the only FAIL is the missing real source)
        env:
          DATABASE_URL: ${{ env.PG }}/regulait_live
          REGULAIT_LICENSE_KEYRING: ${{ runner.temp }}/license-keys
        run: |
          set +e
          pnpm --filter @regulait/gateway demo:prepare --live > "$RUNNER_TEMP/live-unsourced.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/live-unsourced.log"
          test "$code" -ne 0 || { echo "::error::demo:check --live passed with no real discovery source"; exit 1; }
          grep -q "^=== demo:check --live ===" "$RUNNER_TEMP/live-unsourced.log" || { echo "::error::demo:prepare --live stopped before demo:check --live"; exit 1; }
          fails=$(grep -E "^FAIL  " "$RUNNER_TEMP/live-unsourced.log" || true)
          echo "$fails"
          test "$(echo "$fails" | wc -l)" -eq 1 && echo "$fails" | grep -q "1 Real discovery sources" \
            || { echo "::error::expected exactly one FAIL, '1 Real discovery sources'"; exit 1; }
          for beat in "1 Fictional dataset" "1 Signature catalogue" "1 Remediation routing" "1 Remediation environment"; do
            grep -qE "^PASS  $beat" "$RUNNER_TEMP/live-unsourced.log" || { echo "::error::$beat did not PASS"; exit 1; }
          done

      - name: A real source enabled in first-admin setup, then demo:prepare --live (0 fail)
        working-directory: apps/gateway
        env:
          DATABASE_URL: ${{ env.PG }}/regulait_live_sourced
          REGULAIT_LICENSE_KEYRING: ${{ runner.temp }}/license-keys
        run: |
          node --input-type=module -e '
            import path from "node:path";
            import { createDb, runMigrations } from "@regulait/db";
            import { buildApp } from "./dist/app.js";
            const db = createDb(process.env.DATABASE_URL);
            await runMigrations(db, path.resolve("../../packages/db/migrations"));
            const app = buildApp(db, { bootstrapToken: process.env.REGULAIT_BOOTSTRAP_TOKEN, dataKey: process.env.REGULAIT_DATA_KEY });
            await app.ready();
            const headers = { authorization: `Bearer ${process.env.REGULAIT_BOOTSTRAP_TOKEN}` };
            const c = await app.inject({ method: "POST", url: "/v1/discovery/sources", headers,
              payload: { name: "CI endpoint agent", kind: "endpoint_agent", target: { fleet: "ci-pilot" }, scope: { orgLevel: true, include: [] } } });
            if (c.statusCode !== 201) { console.error("create", c.statusCode, c.body); process.exit(1); }
            const e = await app.inject({ method: "POST", url: `/v1/discovery/sources/${c.json().id}/enable`, headers, payload: { version: c.json().version } });
            if (e.statusCode !== 200) { console.error("enable", e.statusCode, e.body); process.exit(1); }
            console.log("enabled", c.json().kind, c.json().name);
            await app.close();
            await db.$client.end();
          '
          set -o pipefail
          pnpm demo:prepare --live | tee "$RUNNER_TEMP/live-sourced.log"
          grep -qE "^PASS  1 Real discovery sources .*endpoint_agent 'CI endpoint agent' enabled, never run" "$RUNNER_TEMP/live-sourced.log"
          grep -qE "^PASS  1 Fictional dataset" "$RUNNER_TEMP/live-sourced.log"
          grep -qE "^PASS  1 Remediation environment 'staging' is an accepted remediation environment: deploy target 'demo-staging' \(mock\)" "$RUNNER_TEMP/live-sourced.log"
          # re-run safety: the live step again on the same database does not duplicate the staging target
          pnpm demo:intake --live | grep -E "already present|FAILED" | tee "$RUNNER_TEMP/live-rerun.log"
          grep -q "deploy target 'demo-staging' (mock, staging) already present" "$RUNNER_TEMP/live-rerun.log"

      - name: The live staging target is one audited mock row
        run: |
          for db in regulait_live regulait_live_sourced; do
            n=$(psql "$PG/$db" -tA -v ON_ERROR_STOP=1 -c "select count(*) from deploy_targets where name = 'demo-staging' and provider = 'mock' and environment = 'staging'")
            a=$(psql "$PG/$db" -tA -v ON_ERROR_STOP=1 -c "select count(*) from audit_log a join deploy_targets t on t.id = a.object_id where t.name = 'demo-staging' and a.rule_id = 'deploy-target-created'")
            echo "$db: $n staging target(s), $a create audit row(s)"
            test "$n" -eq 1 && test "$a" -eq 1
          done

      - name: The fictional dataset is absent from both databases (straight from the tables)
        run: |
          for db in regulait_live regulait_live_sourced; do
            n=$(psql "$PG/$db" -tA -v ON_ERROR_STOP=1 -c "
              select (select count(*) from discovery_sources where name ilike '%(demo dataset)%' or name ilike '%acme bank%')
                   + (select count(*) from discovery_runs)
                   + (select count(*) from shadow_ai_findings)
                   + (select count(*) from shadow_ai_imports)
                   + (select count(*) from connectors where name = 'acme-policy-library')")
            echo "$db: $n fictional-dataset or discovery row(s)"
            test "$n" -eq 0
          done

  # ADR-0197 fallback rehearsal, on a manual dispatch only: the two steps no other job runs. `demo:prepare` twice on
  # the SAME database (re-run safety; demo-journey runs it once, on an empty one), a separate `demo:check`, and
  # `demo:gate` on the seeded database (G3), whose expected decision on a freshly prepared database is DENY with
  # BLOCK open_high_alert lines. The gate runs after each prepare. The ALLOW half of G3 (after the alerts are
  # acknowledged) is not here: it is an owner rehearsal step (DEMO_RUNBOOK §7.5). No browser, no gateway process.
  demo-rehearsal:
    needs: changes
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: demo-rehearsal-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: regulait_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait -d regulait_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://regulait:regulait@localhost:5432/regulait_rehearsal
      REGULAIT_BOOTSTRAP_TOKEN: e2e-bootstrap-token
      # 64-hex test-fixture key, same shape secrets.ts asserts. Not a secret.
      REGULAIT_DATA_KEY: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
      REGULAIT_EPHEMERAL_LICENSE: '1'
      # ADR-0181: the CI Postgres service has no TLS (see demo-journey)
      REGULAIT_DATABASE_SSL: disable
      REGULAIT_PUBLIC_URL: http://127.0.0.1:3105

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - name: Demo export-signing key
        run: pnpm -s --filter @regulait/gateway demo:export-key -- --env | sed -e "s/^export //" -e "s/'//g" >> "$GITHUB_ENV"
        env:
          REGULAIT_DEMO_KEY_DIR: ${{ runner.temp }}/demo-keys

      # the runner context is not available in job-level env, so the two runner-temp paths are set here for every
      # later step
      - name: Runner-temp paths
        run: |
          echo "REGULAIT_LICENSE_KEYRING=$RUNNER_TEMP/license-keys" >> "$GITHUB_ENV"
          echo "REGULAIT_INSTALL_SECRETS_DIR=$RUNNER_TEMP/install-secrets" >> "$GITHUB_ENV"

      - name: Identity issuer key (installer step)
        run: pnpm --filter @regulait/gateway identity-key:init

      - name: demo:prepare, first run (empty database)
        run: |
          set +e
          pnpm --filter @regulait/gateway demo:prepare > "$RUNNER_TEMP/prepare-1.log" 2>&1
          code=$?
          set -e
          # the step names and the check lines only: the log also holds the personas' one-time passwords
          grep -E "^(PASS|WARN|FAIL)  |^=== |complete in|stopped:" "$RUNNER_TEMP/prepare-1.log" || true
          exit $code

      # the deploy gate exits 1 on DENY, 0 on ALLOW and 2 on a setup error; DENY is the expected decision here
      - name: demo:gate after the first run (expected DENY)
        run: |
          set +e
          pnpm -s --filter @regulait/gateway demo:gate -- "Real-Time Fraud Detection Engine" staging ci-rehearsal-1 > "$RUNNER_TEMP/gate-1.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/gate-1.txt"
          echo "exit $code; BLOCK open_high_alert lines: $(grep -cE '^  BLOCK open_high_alert' "$RUNNER_TEMP/gate-1.txt" || true)"
          test "$code" -eq 1 || { echo "::error::demo:gate exited $code, expected 1 (DENY)"; exit 1; }
          grep -qE '^DENY  "Real-Time Fraud Detection Engine"' "$RUNNER_TEMP/gate-1.txt" || { echo "::error::no DENY line"; exit 1; }
          grep -qE '^  BLOCK open_high_alert' "$RUNNER_TEMP/gate-1.txt" || { echo "::error::no BLOCK open_high_alert line"; exit 1; }

      - name: demo:prepare, second run on the same database (re-run safety)
        run: |
          set +e
          pnpm --filter @regulait/gateway demo:prepare > "$RUNNER_TEMP/prepare-2.log" 2>&1
          code=$?
          set -e
          # the step names and the check lines only: the log also holds the personas' one-time passwords
          grep -E "^(PASS|WARN|FAIL)  |^=== |complete in|stopped:" "$RUNNER_TEMP/prepare-2.log" || true
          exit $code

      - name: demo:check after the second run (0 fail)
        run: pnpm --filter @regulait/gateway demo:check

      - name: demo:gate after the second run (expected DENY)
        run: |
          set +e
          pnpm -s --filter @regulait/gateway demo:gate -- "Real-Time Fraud Detection Engine" staging ci-rehearsal-2 > "$RUNNER_TEMP/gate-2.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/gate-2.txt"
          echo "exit $code; BLOCK open_high_alert lines: $(grep -cE '^  BLOCK open_high_alert' "$RUNNER_TEMP/gate-2.txt" || true)"
          test "$code" -eq 1 || { echo "::error::demo:gate exited $code, expected 1 (DENY)"; exit 1; }
          grep -qE '^DENY  "Real-Time Fraud Detection Engine"' "$RUNNER_TEMP/gate-2.txt" || { echo "::error::no DENY line"; exit 1; }
          grep -qE '^  BLOCK open_high_alert' "$RUNNER_TEMP/gate-2.txt" || { echo "::error::no BLOCK open_high_alert line"; exit 1; }

      # the gate output only (no persona credentials in it)
      - name: Keep the gate output (every run)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-rehearsal-gate
          path: ${{ runner.temp }}/gate-*.txt
          if-no-files-found: warn
          retention-days: 7

  # The mocked UI suite (ADR-0183 2.4), sharded, shared with ci.yml in
  # mock-ui-shards.yml — but here ONLY on a manual dispatch.
  #
  # DE-DUPLICATED 2026-10-06. ci.yml's `spa-mock` runs the identical suite on
  # every pull_request except one whose every file is a doc (`**/*.md`,
  # docs/**, internal/**, .gitignore, LICENSE). Every pull_request that
  # fires this workflow touches apps/web, gateway demo code, packages/shared
  # or packages/db, so it fires ci.yml too — unless the change is only .md
  # files under those paths, and no mocked spec reads a repository .md file
  # (checked: none in apps/web/e2e or apps/web/src). Running it here as well
  # bought nothing for ~10–12 billed minutes a run. The one real gap is
  # `workflow_dispatch`: dispatching this workflow does not run ci.yml, so a
  # manual "check the demo now" still runs the mocked suite here.
  demo-mock:
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.demo == 'true'
    concurrency:
      group: demo-mock-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/mock-ui-shards.yml
    with:
      artifact-prefix: demo-mock

  # AER-040: the ADR-0144 approver-review journeys (effective-action review,
  # malformed/legacy/expired refusal, metadata impersonation, re-review on a
  # changed binding) in a real browser against a real gateway + database. The
  # spec's global setup creates its own scratch database and gateway.
  approval-review:
    needs: changes
    if: needs.changes.outputs.review == 'true'
    concurrency:
      group: approval-review-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: regulait
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait -d regulait"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      E2E_PG: postgres://regulait:regulait@localhost:5432
      # ADR-0181: the gateway's defaults are strict. CI's Postgres service has
      # no TLS, so the database hop is relaxed EXPLICITLY here (the default is
      # `require`), and the scheduler (ON by default) is switched off so no
      # tick loop runs underneath a test.
      REGULAIT_DATABASE_SSL: disable
      REGULAIT_SCHEDULER: 'off'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      # Playwright browser cache (#453; ci.yml header item 6).
      - name: Playwright version
        id: playwright
        run: |
          v="$(pnpm --filter @regulait/web exec playwright --version | sed -n 's/^Version \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p')"
          test -n "$v" || { echo "::error::could not read the Playwright version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # Runner image for the apt package cache key; a new image carries new package versions.
          img="${ImageOS:-unknown}-${ImageVersion:-unknown}"
          [[ "$img" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::unexpected runner image id"; exit 1; }
          echo "image=$img" >> "$GITHUB_OUTPUT"
          # The browser cache key carries the image OS (e.g. ubuntu24), so an Ubuntu release change misses cleanly.
          echo "imageos=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.imageos }}-${{ steps.playwright.outputs.version }}-chromium

      # The .deb files `install-deps` downloads are cached too (#453): a slow apt mirror stalled them for 9-13 min
      # even on a browser hit. apt still checks every cached file against the signed package index.
      - name: Restore Playwright apt packages
        id: playwright-apt
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: playwright-apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Seed apt with the cached packages
        env:
          DEBS: ${{ runner.temp }}/playwright-apt
        run: |
          echo 'APT::Keep-Downloaded-Packages "true"; Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99playwright-keep-debs >/dev/null
          if [ -d "$DEBS" ]; then find "$DEBS" -maxdepth 1 -name '*.deb' -exec sudo cp -t /var/cache/apt/archives/ {} +; fi
          echo "apt archive holds $(find /var/cache/apt/archives -maxdepth 1 -name '*.deb' | wc -l) packages"

      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @regulait/web exec playwright install --with-deps chromium

      # Saved straight after the install, not in a post step, so a later test failure or a timeout still keeps it.
      - name: Save Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @regulait/web exec playwright install-deps chromium

      # Saved on a miss straight after the install, like the browsers. Nothing collected means nothing to save.
      - name: Collect Playwright apt packages (cache miss)
        id: playwright-apt-collect
        if: steps.playwright-apt.outputs.cache-hit != 'true'
        env:
          DEBS: ${{ runner.temp }}/playwright-apt
        run: |
          mkdir -p "$DEBS"
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t "$DEBS" {} +
          n="$(find "$DEBS" -maxdepth 1 -name '*.deb' | wc -l)"
          echo "collected $n packages, $(du -sh "$DEBS" | cut -f1)"
          echo "count=$n" >> "$GITHUB_OUTPUT"

      - name: Save Playwright apt packages (cache miss)
        if: steps.playwright-apt.outputs.cache-hit != 'true' && steps.playwright-apt-collect.outputs.count != '0'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/playwright-apt
          key: ${{ steps.playwright-apt.outputs.cache-primary-key }}

      - name: Approver-review journeys (ADR-0144, all five)
        run: pnpm --filter @regulait/web exec playwright test e2e/mcp-action-review.spec.ts e2e/zz-zz-zz-zz-zz-zz-zz-zz-approvals-filter.spec.ts --reporter=list,github

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approval-review-failure
          path: |
            apps/web/test-results
            apps/web/e2e/gateway-e2e.log
          retention-days: 7
