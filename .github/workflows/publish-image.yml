name: Publish image

# Publishes the gateway image to GitHub Container Registry so it can be pulled
# instead of built.
#
# ── Why this is its OWN workflow, and manual ─────────────────────────────────
# `ci.yml` carries measured arithmetic for a 2,000 min/month Actions allowance,
# and its `docker-build` job deliberately SELF-SKIPS on PRs that cannot change
# the image. Publishing on every push would roughly double the image spend and
# produce a tag nobody asked for. So this is `workflow_dispatch` only: a
# publish is an act someone decides to perform, and it costs a run only when
# they do. `ci.yml`'s budget comment stays true because none of its jobs moved.
#
# ── No third-party actions, on purpose ───────────────────────────────────────
# `ci.yml` states the rule: "a third-party action in the CI path is a
# supply-chain surface". A registry-publishing job is the LAST place to relax
# that — it is the step that signs artefacts with a token that can write
# packages. So this uses the Docker CLI already present on the runner plus
# `actions/checkout` (SHA-pinned), plus the cosign release binary checked against its pinned SHA-256.
#
# ── Visibility and signing ───────────────────────────────────────────────────
# The repository is PUBLIC (checked 2026-10-06). The package GHCR creates does
# NOT inherit that: it starts private, so a pull needs `docker login ghcr.io`
# with a PAT carrying `read:packages` until someone makes the package public
# under its settings — a disclosure decision deliberately not automated here.
# Every pushed digest is signed keylessly with cosign (ADR-0184) and the
# signature verified against THIS workflow's identity before the run ends.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (in addition to the commit SHA). Use "latest" only for a build you would hand someone.'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ADR-0184: keyless cosign signing needs the job's OIDC token; this job only
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve image reference
        id: ref
        run: |
          set -euo pipefail
          # GHCR requires a lowercase path; the owner login is not guaranteed to be.
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/regulait" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          set -euo pipefail
          IMAGE='${{ steps.ref.outputs.image }}'
          SHA='${{ steps.ref.outputs.sha }}'
          # Always tag by commit, so a pulled image is traceable to a tree. The
          # optional input tag is additive and never replaces that.
          docker build -t "${IMAGE}:sha-${SHA}" .
          if [ -n "${{ inputs.tag }}" ]; then
            docker tag "${IMAGE}:sha-${SHA}" "${IMAGE}:${{ inputs.tag }}"
          fi

      - name: Push
        run: |
          set -euo pipefail
          IMAGE='${{ steps.ref.outputs.image }}'
          SHA='${{ steps.ref.outputs.sha }}'
          docker push "${IMAGE}:sha-${SHA}"
          if [ -n "${{ inputs.tag }}" ]; then
            docker push "${IMAGE}:${{ inputs.tag }}"
          fi

      - name: Install cosign (pinned version and SHA-256)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/bin/cosign" https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/cosign"

      - name: Sign and verify the published image (keyless)
        run: |
          set -euo pipefail
          IMAGE='${{ steps.ref.outputs.image }}'
          SHA='${{ steps.ref.outputs.sha }}'
          ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:sha-${SHA}")"
          "$RUNNER_TEMP/bin/cosign" sign --yes "$ref"
          COSIGN="$RUNNER_TEMP/bin/cosign" \
          COSIGN_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-image.yml@${GITHUB_REF}" \
            scripts/security-cosign-verify.sh "$ref" signed
          echo "Verify a pull: cosign verify --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish-image.yml@${GITHUB_REF} --certificate-oidc-issuer https://token.actions.githubusercontent.com $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Say what was published
        run: |
          IMAGE='${{ steps.ref.outputs.image }}'
          SHA='${{ steps.ref.outputs.sha }}'
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "docker pull ${IMAGE}:sha-${SHA}"
            [ -n "${{ inputs.tag }}" ] && echo "docker pull ${IMAGE}:${{ inputs.tag }}"
            echo '```'
            echo ""
            echo "The package starts private on GHCR (the repository itself is public): \`docker login ghcr.io\` with a PAT carrying \`read:packages\` before pulling, unless it has been made public. The digest is cosign-signed (see the verify line above)."
          } >> "$GITHUB_STEP_SUMMARY"
