# Proxy-adapter verification — the pinned container M-043 demands.
#
# DELIBERATELY NOT PART OF `ci.yml`, and deliberately not a gate — yet.
#
# Two adapters shipped from this repository without ever being run: one failed
# OPEN on deny, the other could not load its first line. The rule written
# afterwards is that nothing in `integrations/` is called supported until its
# DENY path is exercised end to end against a pinned container with an upstream
# invocation counter. This workflow is that rule made executable.
#
# IT IS ADVISORY (`continue-on-error`) UNTIL IT HAS PASSED ONCE.
#
# The harness has never run against a container either, so gating pull requests
# on it would be the same "ship it and find out" that produced the findings it
# exists to prevent. But `workflow_dispatch` alone cannot start it: GitHub only
# offers that for workflows already on the DEFAULT branch, and this one is not —
# which would mean merging it to prove it and proving it by merging it.
#
# So it runs on pull requests that touch `integrations/`, and it cannot fail
# them. That buys real signal at no cost to the gate. `continue-on-error` comes
# OFF in the same change that restores the Kong support claim, and not before —
# an advisory check nobody ever promotes is just a slower way of not testing.
name: Integrations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "integrations/**"
      - ".github/workflows/integrations.yml"

jobs:
  kong-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory until it has passed once — see the header.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # PINNED. An adapter verified against "whatever Kong is latest today" is
      # verified against nothing in particular — the ordering and sandbox
      # behaviour this plugin depends on are version-specific.
      KONG_IMAGE: kong:3.6
      E2E_PG: postgres://regulait:regulait@localhost:5432

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Pull the pinned Kong image
        run: docker pull "$KONG_IMAGE"

      - name: Verify the Kong adapter's deny path
        run: node integrations/kong/test/verify.mjs
