# Proxy-adapter verification — the pinned container M-043 demands.
#
# A GATE, and deliberately still separate from `ci.yml`: it needs docker and a
# pinned image, and it only runs when `integrations/` changes.
#
# Two adapters shipped from this repository without ever being run: one failed
# OPEN on deny, the other could not load its first line. The rule written
# afterwards is that nothing in `integrations/` is called supported until its
# DENY path is exercised end to end against a pinned container with an upstream
# invocation counter. This workflow is that rule made executable.
#
# IT IS A GATE NOW. It passed on 2026-09-27 (run 36300665525) against kong:3.6,
# and `continue-on-error` came off in the same change that restored the Kong
# support claim — which is what was promised when it went in advisory.
#
# Four rounds to get it green, and every one of them was a fault in the HARNESS
# rather than the adapter: the log capture discarded stderr (so a talking
# container read as silent), the wait could not tell a dead container from a
# slow one, and `mkdtemp` handed Kong a config file it had no permission to
# read. An instrument that has never been run is itself untested, and this is
# what that costs — once.
name: Integrations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "integrations/**"
      - ".github/workflows/integrations.yml"
      # THE ADAPTER'S CONTRACT LIVES ON THE OTHER SIDE TOO. A filter of only
      # `integrations/**` would let a change to `/v1/authz/check`, to the
      # decision kernel, or to the route's admin gating break the adapter with
      # this gate never running — and the claim "verified on every change" would
      # be false in exactly the direction that matters. The web app cannot
      # affect it, so it stays out and doc-only changes still skip the job.
      - "apps/gateway/src/**"
      - "packages/**"
      # AER-034: the lockfile decides which dependency versions the gateway the
      # harness starts is built from. A bump that touches nothing under the
      # paths above still changes that gateway, so it runs this gate too.
      - "pnpm-lock.yaml"

# Least privilege for GITHUB_TOKEN (CodeQL "workflow does not contain permissions"): every job here only
# checks out code and uploads artifacts; nothing writes to the repository, issues, PRs or packages.
permissions:
  contents: read

jobs:
  # ADR-0179 (AER-028, AER-036): the plugin's decision logic with `kong`
  # stubbed — data-scope rules unsupported at the edge and tagged as such, and
  # the mixed-auth session-origin cases (key-auth and basic-auth derive; OIDC,
  # SAML and jwt routes carry only the operator's assertion; a contradiction is
  # refused). Its own job: it needs no docker and no gateway, so it answers in
  # seconds and is not hidden behind the container harness when that fails.
  #
  # OPEN SOURCE FIRST (ADR-0176; ADR-0179 review, finding 9). The spec used to
  # run on a hand-written runner under an unpinned `lua5.4`, which is neither
  # the interpreter Kong runs nor a validated runner. It now runs on busted
  # (MIT) under LuaJIT — the Lua 5.1 dialect of the OpenResty LuaJIT 2.1 that
  # Kong embeds — and every piece is pinned exactly:
  #   * the runner image by name (`ubuntu-24.04`, not `ubuntu-latest`), so the
  #     apt versions below exist;
  #   * LuaJIT and LuaRocks by exact Debian version;
  #   * busted and every transitive rock by `==` in
  #     integrations/kong/test/regulait-authz-spec-dev-1.rockspec, fetched only
  #     from luarocks.org (`--only-server`, so no fallback mirror is consulted),
  #     and the installed tree is then compared against that list.
  # The spec uses no OpenResty-only API, so upstream LuaJIT 2.1 and the
  # OpenResty fork run it identically.
  kong-plugin-spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LUAJIT_DEB: "2.1.0+git20231223.c525bcb+dfsg-1"
      LUAROCKS_DEB: "3.8.0+dfsg1-1"
      ROCKSPEC: integrations/kong/test/regulait-authz-spec-dev-1.rockspec
      ROCKS_TREE: /tmp/regulait-kong-rocks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install the pinned LuaJIT and LuaRocks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            "luajit=$LUAJIT_DEB" "libluajit-5.1-2=$LUAJIT_DEB" \
            "libluajit-5.1-common=$LUAJIT_DEB" "libluajit-5.1-dev=$LUAJIT_DEB" \
            "luarocks=$LUAROCKS_DEB"
          luajit -v
          luarocks --version

      - name: Install busted and its rocks at the pinned versions
        # C rocks (luafilesystem, luasystem, lua-term) build against LuaJIT's
        # own headers, so what is loaded is what was compiled for it.
        run: |
          luarocks --lua-version=5.1 --tree "$ROCKS_TREE" --only-server https://luarocks.org \
            build --only-deps "$ROCKSPEC" LUA_INCDIR=/usr/include/luajit-2.1

      - name: Fail if the installed rocks differ from the pin list
        # One list: the rockspec. Any rock it does not name, or a version it
        # does not name, fails here rather than running the spec on it.
        run: |
          expected=$(grep -oE '"[a-z_-]+ == [^"]+"' "$ROCKSPEC" | tr -d '"' | awk '{print $1" "$3}' | sort)
          installed=$(luarocks --lua-version=5.1 --tree "$ROCKS_TREE" list --porcelain | awk '{print $1" "$2}' | sort)
          echo "$installed"
          diff <(echo "$expected") <(echo "$installed")

      - name: Unit-check the Kong plugin's decision logic (busted on LuaJIT)
        working-directory: integrations/kong
        # busted is run BY luajit explicitly rather than through the luarocks
        # wrapper, whose shebang names whichever `lua` the tree was set up for.
        # A run that found no spec cases must not pass, so the count is checked.
        run: |
          eval "$(luarocks --lua-version=5.1 --tree "$ROCKS_TREE" path)"
          luajit "$ROCKS_TREE/lib/luarocks/rocks-5.1/busted/2.3.0-1/bin/busted" -o TAP | tee "$RUNNER_TEMP/busted.tap"
          n=$(grep -cE '^ok ' "$RUNNER_TEMP/busted.tap")
          echo "passed: $n"
          test "$n" -ge 24

  kong-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PINNED BY DIGEST (AER-034). `kong:3.6` and `postgres:16` are tags, and a
    # tag is a pointer the registry may move under a passing run — a job that
    # pulled "whatever 3.6 is today" was verified against nothing in
    # particular, which is what "pinned" was claiming not to be. Both images
    # are therefore named by content digest, and the Kong one is logged after
    # the pull so the job's output says exactly what the adapter ran against.
    #
    # To bump one: resolve the tag's digest from the registry's manifest API
    # with an anonymous pull token, never by guessing or by copying a digest
    # from a web page —
    #
    #   token=$(curl -sS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/kong:pull" | jq -r .token)
    #   curl -sSI -H "Authorization: Bearer $token" \
    #     -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
    #     https://registry-1.docker.io/v2/library/kong/manifests/3.6 | grep -i docker-content-digest
    #
    # (same for library/postgres, tag 16). The digest is the multi-arch INDEX
    # digest, which is what `docker pull name:tag@sha256:…` resolves on every
    # platform. Resolved 2026-10-03. The service image below and the
    # POSTGRES_IMAGE echoed in the log step must move together.
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # PINNED BY DIGEST — see the note on `services` above. The ordering and
      # sandbox behaviour this plugin depends on are version-specific, and a
      # tag alone could not hold the version still.
      KONG_IMAGE: kong:3.6@sha256:a42d2b4503e7b6674ca7914883bdb0d2274b806b0e397a6af28d1dd57aafce4e
      POSTGRES_IMAGE: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
      E2E_PG: postgres://regulait:regulait@localhost:5432
      # ADR-0181: the gateway's defaults are strict. CI's Postgres service has
      # no TLS, so the database hop is relaxed EXPLICITLY here (the default is
      # `require`), and the scheduler (ON by default) is switched off so no
      # tick loop runs underneath a test.
      REGULAIT_DATABASE_SSL: disable
      REGULAIT_SCHEDULER: 'off'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Pull the digest-pinned Kong image and log what was pulled
        # The digests appear in the job log in the job's own words, from the
        # daemon's image store rather than from this file — so the log is a
        # record of what ran, not a restatement of what was asked for.
        run: |
          docker pull "$KONG_IMAGE"
          echo "kong image ref:      $KONG_IMAGE"
          echo "kong repo digests:   $(docker image inspect --format '{{join .RepoDigests ", "}}' "$KONG_IMAGE")"
          echo "postgres image ref:  $POSTGRES_IMAGE"
          echo "postgres repo digests: $(docker image inspect --format '{{join .RepoDigests ", "}}' "$POSTGRES_IMAGE")"

      - name: Verify the Kong adapter's deny path
        run: node integrations/kong/test/verify.mjs
