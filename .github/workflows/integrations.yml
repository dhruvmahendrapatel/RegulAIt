# Proxy-adapter verification — the pinned container M-043 demands.
#
# A GATE, and deliberately still separate from `ci.yml`: it needs docker and a
# pinned image, and it only runs when `integrations/` changes.
#
# Two adapters shipped from this repository without ever being run: one failed
# OPEN on deny, the other could not load its first line. The rule written
# afterwards is that nothing in `integrations/` is called supported until its
# DENY path is exercised end to end against a pinned container with an upstream
# invocation counter. This workflow is that rule made executable.
#
# IT IS A GATE NOW. It passed on 2026-09-27 (run 36300665525) against kong:3.6,
# and `continue-on-error` came off in the same change that restored the Kong
# support claim — which is what was promised when it went in advisory.
#
# Four rounds to get it green, and every one of them was a fault in the HARNESS
# rather than the adapter: the log capture discarded stderr (so a talking
# container read as silent), the wait could not tell a dead container from a
# slow one, and `mkdtemp` handed Kong a config file it had no permission to
# read. An instrument that has never been run is itself untested, and this is
# what that costs — once.
name: Integrations

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "integrations/**"
      - ".github/workflows/integrations.yml"

jobs:
  kong-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: regulait
          POSTGRES_PASSWORD: regulait
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulait -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # PINNED. An adapter verified against "whatever Kong is latest today" is
      # verified against nothing in particular — the ordering and sandbox
      # behaviour this plugin depends on are version-specific.
      KONG_IMAGE: kong:3.6
      E2E_PG: postgres://regulait:regulait@localhost:5432

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Pull the pinned Kong image
        run: docker pull "$KONG_IMAGE"

      - name: Verify the Kong adapter's deny path
        run: node integrations/kong/test/verify.mjs
