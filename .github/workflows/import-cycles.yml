name: Gateway import cycles

# ADR-0190 I4 follow-ups. #383 shipped a runtime temporal-dead-zone crash from a static import cycle in the gateway
# (mcp-proxy -> executor-stdio -> ... -> compat-core). Two checks on the COMPILED gateway, which is the graph Node
# loads (type-only imports are erased by tsc; lazy `await import()` edges do not count):
#
#   1. scripts/preflight-import-cycles.mjs — a ratchet: no import edge on a cycle that is not in
#      scripts/import-cycles-gateway.baseline.txt, and no baseline entry that is no longer on one (shrink it with
#      `node scripts/preflight-import-cycles.mjs --update` after breaking a cycle). Tool: dependency-cruiser (MIT,
#      pinned; scripts/THIRD_PARTY.md).
#   2. scripts/preflight-import-smoke.mjs — imports every non-test gateway module ALONE, as the first module of a
#      contained child process and fails on any error at init, or on a listener left open. Each child has a
#      throwaway HOME and working directory, a scrubbed environment, Node's permission model (read the repo, write
#      only its sandbox, no child processes or workers), no network (`unshare -rn`; ubuntu-latest needs the AppArmor
#      user-namespace restriction relaxed first, the step before the check, and the check fails under CI=true when
#      `unshare -rn` still does not work) and its own process group. Command-line and demo entry points are skipped by an explicit list in the script.
#      It also covers what the ratchet cannot see: a top-level `await import()` and a `createRequire` require.
#
# Its own workflow (not a step of CI's build-and-test-base) so the ~2 minutes of child processes do not eat that
# job's time cap; it needs only the gateway and its workspace dependencies built, and no services.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'project-state/**'
      - '.gitignore'
      - 'LICENSE'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: import-cycles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gateway-import-cycles:
    name: gateway import cycles / ratchet + load-alone smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the gateway and its workspace dependencies
        run: pnpm --filter "@regulait/gateway..." build

      # The baseline may only SHRINK: a PR that adds an edge line to it (rather than breaking a cycle) fails here,
      # whatever `--update` wrote. Compared with the PR's base branch. On a schedule or manual run there is no
      # base to compare with, so only the ratchet below runs. A base without the file (the PR that introduced it)
      # is skipped.
      - name: The import-cycle baseline only shrinks
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          f=scripts/import-cycles-gateway.baseline.txt
          git fetch --no-tags --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:$f" 2>/dev/null; then
            echo "origin/$BASE_REF has no $f yet; nothing to compare."
            exit 0
          fi
          added="$(git diff --no-ext-diff "origin/$BASE_REF" -- "$f" | grep '^+[^#+]' || true)"
          if [ -n "$added" ]; then
            echo "::error file=$f::the import-cycle baseline gained edges; break the cycle instead of listing it:"
            echo "$added"
            exit 1
          fi
          echo "the baseline did not grow"

      - name: No new import cycle in apps/gateway (baseline ratchet)
        if: success() || failure()
        run: node scripts/preflight-import-cycles.mjs

      # ubuntu-latest blocks unprivileged user namespaces through AppArmor, so `unshare -rn` fails there until this
      # is relaxed (for this ephemeral runner only). An image without the sysctl skips it; the smoke check then
      # refuses to run without network isolation under CI=true.
      - name: Allow unprivileged user namespaces for the smoke check's network isolation
        if: success() || failure()
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns does not exist here; nothing to relax"
          fi
          if unshare -rn true; then echo "unshare -rn works"; else echo "unshare -rn still does not work"; fi

      - name: Every gateway module loads alone, as the first module
        if: success() || failure()
        run: node scripts/preflight-import-smoke.mjs
