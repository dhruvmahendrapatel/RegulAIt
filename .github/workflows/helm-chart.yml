name: Helm chart

# ADR-0304: render-time tests for deploy/helm/regulait. Lint, template, kubeconform, restricted-pod checks, the
# refusals of insecure values, and the CRD/Role copies matching deploy/operator. Never talks to a cluster.
#
# ADR-0305: the chart is distributed as an OCI artifact, signed keylessly with cosign.
#   package  every run: `helm package`, push to a throwaway local registry, pull it back and compare, so every PR
#            proves the OCI path works. Nothing leaves the runner.
#   publish  workflow_dispatch on main only, a decision someone makes (like publish-image.yml): push to
#            ghcr.io/<owner>/charts/regulait, sign the pushed digest keylessly with this workflow's OIDC identity
#            (logged to Rekor), and verify it before the run ends. Until the release-key ceremony (lane E9) lands,
#            keyless CI signing is the chart's signature; the update bundle that carries the chart for air-gapped
#            installs is signed with the release key as before (ADR-0041).

on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - 'deploy/operator/config/**'
      - '.github/workflows/helm-chart.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - 'deploy/operator/config/**'
      - '.github/workflows/helm-chart.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the chart to ghcr.io and sign it (main only)'
        type: boolean
        default: false

concurrency:
  group: helm-chart-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  render:
    name: helm chart / render tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELM_VERSION: v3.22.1
      HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: deploy/operator/go.mod
          cache: false
      - name: Install helm (pinned version, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Install kubeconform (pinned)
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: Render tests
        run: KUBECONFORM="$RUNNER_TEMP/bin/kubeconform" bash deploy/helm/regulait/tests/render-test.sh helm

  package:
    name: helm chart / package and OCI round trip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HELM_VERSION: v3.22.1
      HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm (pinned version, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - name: Package, push to the local registry, pull back and compare
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pkg"; mkdir -p "$out/pulled"
          helm package deploy/helm/regulait --destination "$out"
          tgz="$(ls "$out"/regulait-*.tgz)"
          helm push "$tgz" oci://localhost:5000/charts --plain-http | tee "$out/push.log"
          digest="$(sed -n 's/^Digest: //p' "$out/push.log")"
          case "$digest" in sha256:*) ;; *) echo "::error::helm push printed no digest"; exit 1 ;; esac
          version="$(sed -n 's/^version: //p' deploy/helm/regulait/Chart.yaml)"
          helm pull "oci://localhost:5000/charts/regulait" --version "$version" --plain-http --destination "$out/pulled"
          cmp "$tgz" "$out/pulled/$(basename "$tgz")"
          echo "packaged $(basename "$tgz"), OCI digest $digest, round trip identical" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: helm chart / publish and sign (ghcr.io, keyless)
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [render, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      HELM_VERSION: v3.22.1
      HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
      COSIGN_VERSION: '3.1.3'
      COSIGN_SHA256: '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm and cosign (pinned versions, checksums verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm-${HELM_VERSION}-linux-amd64.tar.gz" | sha256sum -c -
          tar xzf "helm-${HELM_VERSION}-linux-amd64.tar.gz"
          mkdir -p bin && mv linux-amd64/helm bin/
          curl -sSfL --retry 3 -o bin/cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  bin/cosign" | sha256sum -c -
          chmod +x bin/cosign
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Package and push to ghcr.io
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          out="$RUNNER_TEMP/pkg"; mkdir -p "$out"
          helm package deploy/helm/regulait --destination "$out"
          # the token goes to helm on stdin, never the command line
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$(ls "$out"/regulait-*.tgz)" "oci://ghcr.io/${owner}/charts" | tee "$out/push.log"
          digest="$(sed -n 's/^Digest: //p' "$out/push.log")"
          case "$digest" in sha256:*) ;; *) echo "::error::helm push printed no digest"; exit 1 ;; esac
          echo "ref=ghcr.io/${owner}/charts/regulait@${digest}" >> "$GITHUB_OUTPUT"
      - name: Sign (keyless, this workflow's OIDC identity, logged to Rekor)
        env:
          REF: ${{ steps.push.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | cosign login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "$REF"
      - name: Verify the signature against this workflow on main
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          set -euo pipefail
          cosign verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/helm-chart.yml@refs/heads/main" \
            >/dev/null
          {
            echo "### Chart published and signed"
            echo ""
            echo "\`${REF}\`, signed keylessly by \`.github/workflows/helm-chart.yml@refs/heads/main\` (Rekor entry is public)."
          } >> "$GITHUB_STEP_SUMMARY"
