# Dependabot version updates (owner decision 2026-10-22, issue #453).
# Security alerts and security-fix PRs do not depend on this file.
# Minor and patch bumps are grouped per ecosystem so each week yields at most one
# PR per entry; major bumps arrive one per PR. Engine manifests are image inputs:
# merging a bump there republishes the engine images (publish gate, lock PR).
# Not covered on purpose: infra/demo-fixtures/** (seeded demo data) and spikes/**.
# The two pip entries open security-fix PRs only (see below).
version: 2
updates:
  - package-ecosystem: "npm" # pnpm workspace (pnpm-lock.yaml)
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      workspace-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm" # promptfoo engine image
    directory: "/engines/promptfoo"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(engines)"
    groups:
      promptfoo-minor-patch:
        update-types: ["minor", "patch"]

  # pip entries: security-fix PRs only (owner decision 2026-10-23, #453). The
  # requirements are a uv-compiled, one-hash-per-pin, --no-deps closure that
  # Dependabot's pip updater cannot regenerate, so version-update PRs would fail
  # the image tests. A limit of 0 turns off version updates; security PRs still
  # open and need a manual `uv pip compile` re-run (see the file header).
  - package-ecosystem: "pip" # garak engine image (hash-pinned requirements)
    directory: "/engines/garak"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(engines)"
    groups:
      garak-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip" # modelscan engine image
    directory: "/engines/modelscan"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(engines)"
    groups:
      modelscan-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions" # actions pinned by commit SHA
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # Base-image digests (owner decision 2026-10-23, #453). Every FROM is pinned by
  # digest. One entry across all Dockerfile directories with group-by
  # dependency-name, so each base image (node, python, docker-cli) arrives as ONE
  # PR touching every directory: the engine image tests require the engines'
  # node base to equal the gateway's, so per-directory PRs could never go green.
  # The ignore rules keep these to digest refreshes within the pinned Node major
  # and Python minor (the engine requirements are compiled for CPython 3.12);
  # docker-cli may take minor and patch bumps. Node and python refreshes
  # republish the engine images (publish gate, lock PR); a docker-cli bump also
  # needs packages/sandbox-executor/THIRD_PARTY.md updated.
  - package-ecosystem: "docker" # gateway, sandbox-executor, stdio-base, engines
    directories:
      - "/"
      - "/packages/sandbox-executor"
      - "/packages/sandbox-executor/stdio-base"
      - "/engines/garak"
      - "/engines/promptfoo"
      - "/engines/modelscan"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "node" # stay on the gateway's Node major; digest refreshes only
        update-types: ["version-update:semver-major"]
      - dependency-name: "python" # engine closures are compiled for CPython 3.12
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      base-images:
        group-by: dependency-name
        patterns: ["*"]

  # docker-compose image pins (owner decision 2026-10-23, #453). seaweedfs and
  # keycloak are updated through their ${VAR:-image@sha256:...} defaults; postgres
  # once digest-pinned. caddy's pin sits behind a YAML anchor the updater cannot
  # rewrite, so it needs the anchor restructured (compose pin PR). The engine
  # images use a separate digest variable and are refreshed by the engine lock PR,
  # not here. Majors (e.g. a postgres data-directory upgrade) arrive one per PR.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "regulait/*" # our own locally built :local images
    groups:
      compose-images:
        update-types: ["minor", "patch"]
