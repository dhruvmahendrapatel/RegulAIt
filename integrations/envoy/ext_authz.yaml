# ADR-0127 / ROADMAP G9 — WITHDRAWN. THERE IS NO ENVOY ADAPTER.
#
# This file used to contain an `ext_authz` configuration. It was unsafe, it was
# never run against a real Envoy, and it has been removed rather than patched.
# What is left is the reason, so that nobody rebuilds it the same way and so the
# ADR's claim that "both adapters fail closed" is corrected where it was made.
#
# DO NOT COPY THE OLD VERSION OUT OF GIT HISTORY. Four things were wrong with
# it, and the first is the one that matters:
#
#  1. IT FAILED OPEN ON DENY — the exact outcome the whole feature exists to
#     prevent.
#
#     Envoy's HTTP `ext_authz` decides from the STATUS CODE: 2xx means allow,
#     anything else means denied. `POST /v1/authz/check` answers 200 for all
#     three outcomes and carries the decision in the JSON body, because that is
#     what the Kong adapter (which parses the body) needs. Envoy does not parse
#     the body. So a correctly computed, correctly audited `deny` would have
#     reached Envoy as 200 and been admitted — with a ledger row saying the
#     request was refused. Worse than no adapter: a deployment that believes it
#     is governed, and an audit trail that agrees with it.
#
#  2. It could not have produced a decision at all. Envoy's HTTP ext_authz
#     sends no request body unless `with_request_body` is configured, and
#     `/v1/authz/check` parses its body with a required zod schema — so every
#     check would have been a 400. A 400 is non-2xx, so in practice it would
#     have denied EVERYTHING rather than allowing everything. That is luck, not
#     design: the fail-open in (1) is what the config actually specified, and
#     it is what a customer would have hit the moment they fixed the body.
#
#  3. `path_prefix` PREPENDS to the original request path. It is not a route
#     override. The PDP would have been asked for `/v1/authz/check/<whatever
#     path the client requested>`, which the gateway does not route.
#
#  4. It forwarded `x-regulait-decision` and `x-regulait-reason` back to the
#     client via `allowed_client_headers`. The endpoint has never set those
#     headers — they are a Kong-side construct. The config described a contract
#     the server does not implement.
#
# WHAT A REAL ADAPTER NEEDS, so the next attempt starts from the right place:
#
#  - A status-code contract Envoy can act on, not a body one: the PDP must
#    answer non-2xx for `deny` and `approval_required`, distinguishing them by
#    header. That is a change to the ENDPOINT, and it breaks Kong's current
#    `res.status ~= 200 -> pdp_error` branch, so the two adapters and the route
#    have to move together. It is a contract decision, not a config tweak.
#  - Subject derivation from Envoy's own authenticated identity, never from a
#    client-settable header — the same defect the Kong adapter carried and the
#    header-stripping it now does.
#  - Verification against a PINNED ENVOY CONTAINER with an upstream invocation
#    counter, asserting ZERO upstream calls for every deny, every
#    approval_required, and every PDP failure. A adapter whose deny path is not
#    exercised end to end is an adapter whose deny path does not work; that is
#    the lesson this file is.
#
# Contract reference:
# https://www.envoyproxy.io/docs/envoy/latest/api-v3/extensions/filters/http/ext_authz/v3/ext_authz.proto
#
# Until that exists, RegulAIt supports Kong for this integration and does not
# support Envoy. Saying so is cheaper than the alternative.
