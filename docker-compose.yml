# One command to a usable product:  docker compose up --build
# Then open http://localhost:3000/ui (the React SPA — ADR-0026; the legacy
# shells stay at /app and /admin). Demo API keys and one-time passwords are
# printed once in the gateway container log (docker compose logs gateway).
# The image build stage runs `pnpm -r build`, which includes the web bundle,
# so /ui is always built inside the container.
#
# TLS (ADR-0029): the `caddy` service below terminates HTTPS in front of the
# gateway. It sits behind the `tls` compose profile, so it is OFF for a plain
# `docker compose up` — a laptop must never attempt ACME issuance for the box's
# hostname (failed challenges burn Let's Encrypt rate limits). Turn it on with:
#
#   docker compose --profile tls up -d --build          # real Let's Encrypt cert
#   docker compose --profile tls -f docker-compose.yml -f compose.tls-local.yml up
#                                                       # local proof, self-signed CA
#
# See docs/ops/TLS.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: regulait
      POSTGRES_PASSWORD: regulait
      POSTGRES_DB: regulait
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulait"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [regulait]

  gateway:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://regulait:regulait@db:5432/regulait
      # dev-grade defaults — override every one of these anywhere shared
      REGULAIT_DATA_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      REGULAIT_BOOTSTRAP_TOKEN: dev-bootstrap
      SEED_DEMO: "1"
      # ADR-0031 (narrowing ADR-0029): which peers may speak for the client via
      # X-Forwarded-*. `req.ip` is recorded on every auth_sessions row and is
      # the attribution pillar 1 sells, so this must name the proxy rather than
      # trusting whoever connects. Caddy has a fixed address on the compose
      # network below, so this is its /32 and nothing else — in particular NOT
      # host loopback, which is where `127.0.0.1:3000:3000` and the on-box SSM
      # `curl localhost:3000` verification land. Anything reaching the gateway
      # port without going through Caddy therefore cannot choose the client IP
      # that appears on the compliance trail.
      #
      # Harmless with the `tls` profile OFF: 172.28.0.2 simply does not exist,
      # so nothing is trusted and req.ip is the socket peer.
      REGULAIT_TRUSTED_PROXIES: ${REGULAIT_TRUSTED_PROXIES:-172.28.0.2}
      # Optional — set a provider's API key here (or in a .env / secret) to
      # activate real model dispatch platform-wide, no admin-UI paste, no key in
      # the DB. Read at dispatch time only; a stored credential still wins.
      # ANTHROPIC_API_KEY: sk-ant-...   # (optional ANTHROPIC_BASE_URL) → Claude live
      # OPENAI_API_KEY / GOOGLE_API_KEY (or GEMINI_API_KEY) / XAI_API_KEY likewise
    ports:
      # ADR-0029: bound to host loopback ONLY — never 0.0.0.0. Caddy reaches the
      # gateway over the compose network (`gateway:3000`), so cleartext HTTP is
      # not exposed off-box. Loopback is kept because `http://localhost:3000/ui`
      # is the documented local-dev entry point (README) and the on-box
      # SSM verification step (`curl -sf localhost:3000/...`) relies on it.
      - "127.0.0.1:3000:3000"
    networks: [regulait]

  # --- TLS terminator (profile: tls) -----------------------------------------
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    depends_on:
      - gateway
    restart: unless-stopped
    environment:
      # Public hostname this stack serves. Default is the sslip.io name derived
      # from the dev box's public IP (see infra/caddy/Caddyfile). Override when
      # the IP changes or a real domain arrives.
      REGULAIT_TLS_HOST: ${REGULAIT_TLS_HOST:-3-237-199-248.sslip.io}
      # Where Caddy proxies to. Compose-network DNS name of the gateway.
      REGULAIT_TLS_UPSTREAM: ${REGULAIT_TLS_UPSTREAM:-gateway:3000}
      # Empty = real Let's Encrypt. compose.tls-local.yml sets `tls internal`.
      REGULAIT_TLS_ISSUER: ${REGULAIT_TLS_ISSUER:-}
      # Optional ACME account contact, e.g. "email ops@example.com".
      REGULAIT_TLS_EMAIL_DIRECTIVE: ${REGULAIT_TLS_EMAIL_DIRECTIVE:-}
    ports:
      - "80:80" # ACME HTTP-01 challenge + redirect to HTTPS
      - "443:443" # TLS
      - "443:443/udp" # HTTP/3
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # THE operationally critical bit: /data holds the ACME account key and
      # every issued certificate. Without a named volume, each `compose up`
      # (i.e. every deploy) starts from an empty /data and re-issues from
      # scratch — Let's Encrypt allows 5 duplicate certificates per week, so a
      # few deploys in a day would lock issuance out for the rest of the week.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      regulait:
        # ADR-0031: a FIXED address, so the gateway's REGULAIT_TRUSTED_PROXIES
        # can name exactly this container and nothing else. Without it Docker
        # hands out whatever is free and the only expressible trust would be
        # the whole subnet — which would also cover the db container.
        ipv4_address: 172.28.0.2

# ADR-0031: an explicit network with a pinned subnet, rather than the implicit
# default one, purely so the proxy's address is deterministic and can be named
# in REGULAIT_TRUSTED_PROXIES above. If 172.28.0.0/16 collides with something
# already on the host, compose fails loudly at network-create time — override
# both this subnet and REGULAIT_TRUSTED_PROXIES together if that happens.
#
# `ip_range` is what makes the pin above actually work, and it is NOT optional.
# Pinning an address does not RESERVE it: Docker's dynamic allocator hands out
# addresses from the start of the subnet to whichever container starts first,
# and `caddy` is necessarily last (the gateway waits on db's healthcheck, and
# caddy waits on the gateway). So db took 172.28.0.2, and caddy then failed to
# start with a bare `Error response from daemon: Address already in use` —
# with the whole stack otherwise healthy, which made it look like a host port
# conflict rather than an IPAM one.
#
# Confining dynamic allocation to 172.28.1.0/24 puts every automatically
# assigned address well clear of 172.28.0.2, so the only container that can
# ever hold it is the one that explicitly asks for it.
networks:
  regulait:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
          # Dynamic pool ONLY. Statically pinned addresses (caddy) live outside
          # it, in 172.28.0.0/24, and must stay outside it.
          ip_range: 172.28.1.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
