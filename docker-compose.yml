# One command to a usable product:  docker compose up --build
# Then open http://localhost:3000/ui (the React SPA — ADR-0026; the legacy
# shells stay at /app and /admin). Demo API keys and one-time passwords are
# printed once in the gateway container log (docker compose logs gateway).
# The image build stage runs `pnpm -r build`, which includes the web bundle,
# so /ui is always built inside the container.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: regulait
      POSTGRES_PASSWORD: regulait
      POSTGRES_DB: regulait
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regulait"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://regulait:regulait@db:5432/regulait
      # dev-grade defaults — override every one of these anywhere shared
      REGULAIT_DATA_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      REGULAIT_BOOTSTRAP_TOKEN: dev-bootstrap
      SEED_DEMO: "1"
      # Optional — set a provider's API key here (or in a .env / secret) to
      # activate real model dispatch platform-wide, no admin-UI paste, no key in
      # the DB. Read at dispatch time only; a stored credential still wins.
      # ANTHROPIC_API_KEY: sk-ant-...   # (optional ANTHROPIC_BASE_URL) → Claude live
      # OPENAI_API_KEY / GOOGLE_API_KEY (or GEMINI_API_KEY) / XAI_API_KEY likewise
    ports:
      - "3000:3000"

volumes:
  pgdata:
