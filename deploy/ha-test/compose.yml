# ADR-0343 slice 3: the failover suite's Docker Compose backend. Test infrastructure only, never a deployment.
# Driven by failover-suite.mjs --backend compose, which sets the REGULAIT_HA_* variables and runs `docker compose`
# with the project name regulait-ha. Every port is published on 127.0.0.1 only.
#
#   pg-primary  Postgres primary; synchronous_standby_names = 'FIRST 1 (standby1)', set once the standby streams
#   pg-standby  a base backup of the primary, streaming as standby1 (synchronous)
#   writer      the writer endpoint (writer-proxy.mjs), repointed at the standby on failover
#   gw-a, gw-b  two gateway replicas from this repository's Dockerfile, sharing one install-secrets volume

x-postgres: &postgres
  # the same pinned image as the main docker-compose.yml
  image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
  environment:
    POSTGRES_USER: regulait
    POSTGRES_PASSWORD: ${REGULAIT_HA_DB_PASSWORD:?set by failover-suite.mjs}
    POSTGRES_DB: regulait
  networks: [ha]

x-gateway: &gateway
  image: regulait-ha-gateway:local
  build:
    context: ../..
    dockerfile: Dockerfile
  depends_on:
    writer:
      condition: service_started
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
    DATABASE_URL: postgres://regulait:${REGULAIT_HA_DB_PASSWORD}@writer:5432/regulait
    REGULAIT_DATABASE_SSL: disable
    REGULAIT_DATA_KEY: ${REGULAIT_HA_DATA_KEY:?set by failover-suite.mjs}
    REGULAIT_BOOTSTRAP_TOKEN: ${REGULAIT_HA_BOOTSTRAP_TOKEN:?set by failover-suite.mjs}
    REGULAIT_DEV_PRIVILEGED_DB_LOGIN: "1"
    REGULAIT_MIGRATIONS_UNASSIGNED: apply
    REGULAIT_INSTALL_SECRETS_DIR: /app/install-secrets
    REGULAIT_RATE_LIMIT: "off"
    REGULAIT_DRAIN_DELAY_MS: "0"
    SEED_DEMO: "0"
  volumes:
    - install-secrets:/app/install-secrets
  networks: [ha]

services:
  pg-primary:
    <<: *postgres
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      # synchronous_standby_names is NOT set here: the image's first-start init server inherits these flags, and
      # its CREATE DATABASE would wait forever for a standby that cannot reach it yet. backends/compose.mjs sets it
      # with ALTER SYSTEM once standby1 is streaming, as the native backend does.
      - -c
      - synchronous_commit=on
      - -c
      - max_connections=200
    volumes:
      - ./pg/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      # over TCP: the init server listens on the Unix socket only, so this passes once the real server is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U regulait -d regulait"]
      interval: 1s
      timeout: 2s
      retries: 60

  pg-standby:
    <<: *postgres
    depends_on:
      pg-primary:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/ha/standby-entrypoint.sh"]
    environment:
      PGPASSWORD: ${REGULAIT_HA_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./pg/standby-entrypoint.sh:/ha/standby-entrypoint.sh:ro

  writer:
    image: regulait-ha-gateway:local
    depends_on:
      pg-primary:
        condition: service_healthy
    command: ["node", "/ha/writer-proxy.mjs", "--listen", "0.0.0.0:5432", "--control", "0.0.0.0:5499", "--target", "pg-primary:5432"]
    volumes:
      - ./writer-proxy.mjs:/ha/writer-proxy.mjs:ro
    ports:
      - "127.0.0.1:15432:5432"
      - "127.0.0.1:15499:5499"
    networks: [ha]

  gw-a:
    <<: *gateway
    ports: ["127.0.0.1:13101:3000"]

  gw-b:
    <<: *gateway
    ports: ["127.0.0.1:13102:3000"]

volumes:
  install-secrets:

networks:
  ha:
