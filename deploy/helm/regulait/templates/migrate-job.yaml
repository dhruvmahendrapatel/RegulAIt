{{- /*
The migration Job (ADR-0304 §5): runs the new image's migrations before the Deployment moves to it. A failed Job fails
the install or upgrade, so the old version keeps running. The release's ServiceAccount does not exist yet on a first
install (hooks run before release resources), so the Job uses the namespace default with no token mounted.

Before migrating, an init container runs the operator binary's `verify-bundle` (same build, same compiled-in release
keyring) against the signed manifest in `bundle.configMapName`, so the plain-Helm path refuses an unsigned or
downgraded version too (ADR-0180). The installed version is `bundle.installedVersion` when set (the stronger source:
a value in the release, not a label anyone with namespace write can change), else the running Deployment's version
label read with `lookup`. An upgrade with neither fails the render rather than skip the downgrade check: `lookup` is
empty under `helm template --is-upgrade`, `--dry-run` and GitOps renderers.
*/ -}}
{{- $installed := .Values.bundle.installedVersion | default "" -}}
{{- if not $installed -}}
{{- $live := lookup "apps/v1" "Deployment" .Release.Namespace (include "regulait.name" .) -}}
{{- if $live -}}
{{- $installed = index ($live.metadata.labels | default dict) "app.kubernetes.io/version" | default "" -}}
{{- end -}}
{{- end -}}
{{- if and .Release.IsUpgrade (not $installed) -}}
{{- fail "upgrade: the installed version is unknown (no bundle.installedVersion and no running gateway Deployment found with lookup); set bundle.installedVersion so the downgrade check runs" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-migrate-%d" .Release.Name .Release.Revision | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "regulait.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "regulait.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- include "regulait.podSecurity" . | nindent 8 }}
      initContainers:
        - name: verify-bundle
          image: {{ printf "%s@%s" .Values.operator.image.repository .Values.operator.image.digest }}
          imagePullPolicy: IfNotPresent
          command: ["/manager", "verify-bundle"]
          args:
            - --manifest=/bundle/manifest.json
            - --signature=/bundle/manifest.json.sig
            - --version={{ .Values.version }}
            {{- with $installed }}
            - --installed-version={{ . }}
            {{- end }}
          securityContext:
            {{- include "regulait.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - { name: bundle, mountPath: /bundle, readOnly: true }
      containers:
        - name: migrate
          image: {{ include "regulait.image" . }}
          imagePullPolicy: IfNotPresent
          command: ["node", "apps/gateway/dist/migrate-job.js"]
          env:
            - name: REGULAIT_DEPLOY_MODE
              value: {{ .Values.mode | quote }}
            - name: NODE_ENV
              value: production
            {{- include "regulait.secretEnv" . | nindent 12 }}
          securityContext:
            {{- include "regulait.containerSecurity" . | nindent 12 }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: bundle
          configMap:
            name: {{ .Values.bundle.configMapName | quote }}
            items:
              - { key: manifest.json, path: manifest.json }
              - { key: manifest.json.sig, path: manifest.json.sig }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
