# gitleaks configuration for security.yml (ADR-0184).
#
# The default rule set stays on in full. The only exceptions below are the
# SYNTHETIC values our own tests and docs use to prove that redaction, DLP and
# secret scrubbing work, plus four non-secrets the generic rule misreads.
#
# Every exception is (path AND exact value), never a path alone: a real secret
# pasted into one of these test files is still a finding, because its value is
# not on the list. Nothing here allow-lists a production code path wholesale.
#
# To add an exception: use an obviously synthetic value (repeated or sequential
# characters, "test"/"synthetic"/"never-echoed" in the string), add one
# [[allowlists]] block naming the file and the anchored value, and say why. See
# docs/ops/SECURITY_CI.md "Adding an allow-list entry".

title = "regulAIt gitleaks config"

[extend]
useDefault = true

# --- Test fixtures: synthetic secrets the scrub/DLP/redaction tests feed in ---

[[allowlists]]
description = "Synthetic test credentials: redaction, DLP and scrub test inputs"
condition = "AND"
paths = [
  '''^apps/gateway/src/adr0122-mcp-discovery\.test\.ts$''',
  '''^apps/gateway/src/adr0181-fx2-identity-keys\.test\.ts$''',
  '''^apps/gateway/src/adr0181-strict-identity\.test\.ts$''',
  '''^apps/gateway/src/credential-derived-egress\.test\.ts$''',
  '''^apps/gateway/src/data-key-custody\.test\.ts$''',
  '''^apps/gateway/src/dev-secrets\.test\.ts$''',
  '''^apps/gateway/src/gateway-logger\.test\.ts$''',
  '''^apps/gateway/src/guardrails\.test\.ts$''',
  '''^apps/gateway/src/process-lifecycle\.test\.ts$''',
  '''^apps/gateway/src/prose-scrub\.test\.ts$''',
  '''^apps/gateway/src/rate-limit\.test\.ts$''',
  '''^apps/web/e2e/phase1\.spec\.ts$''',
  '''^packages/pm-provider/src/inbound\.test\.ts$''',
  '''^packages/shared/src/audit-scrub-redos\.test\.ts$''',
  '''^packages/shared/src/audit-scrub\.test\.ts$''',
  '''^packages/shared/src/chatops\.test\.ts$''',
  '''^packages/shared/src/credential-energy-adr0175-review\.test\.ts$''',
  '''^packages/shared/src/mcp-discovery\.test\.ts$''',
  '''^packages/shared/src/outbound-secret-evaluation\.test\.ts$''',
]
regexTarget = "secret"
regexes = [
  # the jwt.io sample token and two hand-made unsigned JWTs
  '''^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4ifQ\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dBjftJeZ4CVPmB92K27uhbUJU1p1r_wW1gFWFOEjXk$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxIn0\.c2lnbmF0dXJlX2hlcmVfb2s$''',
  # test passwords for the identity suites
  '''^Fx2-Strong-pass-1$''',
  '''^Sa0181-Strong-pass$''',
  '''^definitely-Wrong-1$''',
  # sequential / patterned hex and named test keys
  '''^0123456789abcdef$''',
  '''^3f9a1c7e2b8d4f60a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718$''',
  '''^rgl_this-must-never-be-logged-0123456789abcdef$''',
  '''^sk_live_abcdefghijklmnop$''',
  '''^sk-e2e-never-echoed-0123456789$''',
  '''^rglwh_test_secret_0123456789abcdef$''',
  '''^s3cr3t-signing-key$''',
  '''^3f2b9c1e-0d4a-4c55-9a77-1b2c3d4e5f60$''',
  '''^AKIAABCDEFGHIJKLMNOP$''',
  # mcp-discovery.test.ts: one synthetic value per credential shape it scrubs
  '''^4f1c9a2e7b3d8e6f0a5c2b9d1e8f7a6c3b4d5e6f$''',
  '''^7d2f9c1b4a8e6f3d0c5b2a9e8d7f6c1b3a4e5d6f$''',
  '''^9f8e7d6c5b4a3f2e1d0c9b8a7f6e5d4c3b2a1f0e$''',
  '''^c3a1e5f7b9d2468ace0f13579bdf2468ace13579$''',
