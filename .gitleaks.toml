# --- Header-only PEM test inputs (review B1-08) ---
# gitleaks' private-key rule matches lazily from a BEGIN header to the next
# "KEY-----", so these two matches span code, not key material, and a prefix
# regex alone would also cover a real key placed after the header. They are
# allowed only in the exact commits that introduced them: any later change to
# that text is a new commit and is scanned with no exception.

[[allowlists]]
description = "Header-only PEM inputs, in the commits that added them"
condition = "AND"
paths = [
  '''^apps/gateway/src/credential-derived-egress\.test\.ts$''',
  '''^packages/shared/src/audit-scrub-redos\.test\.ts$''',
]
commits = [
  "4462cde8fc635989ff9a0dcc68db998c0d3452fc",
  "3f9af9a010137ce5b9768f6ea5bbbd4257d4b1e9",
]
regexTarget = "secret"
regexes = [
  '''^-----BEGIN PRIVATE KEY-----\\nx\\n-----END PRIVATE KEY-----\\n" \}\),\n''',
  '''^-----BEGIN RSA PRIVATE KEY-----";\n\nfunction timed\(''',
]

# --- Non-secrets in source and docs that the generic rule misreads ---

[[allowlists]]
description = "Demo scenario keys are identifiers, not credentials"
condition = "AND"
paths = ['''^packages/shared/src/demo-intake/scenario-library\.ts$''']
regexTarget = "secret"
regexes = ['''^(hallucination|scope-drift|shadow-ai)-scenario-[0-9]+$''']

[[allowlists]]
description = "A HIPAA citation key (45 CFR 164.408), not a credential"
condition = "AND"
paths = ['''^packages/shared/src/incident-clocks\.ts$''']
regexTarget = "secret"
regexes = ['''^164\.408-secretary-annual$''']

[[allowlists]]
description = "A code comment naming the documented placeholder shape of a key"
condition = "AND"
paths = ['''^packages/shared/src/guardrails\.ts$''']
regexTarget = "secret"
regexes = ['''^sk_live_x+$''']

[[allowlists]]
description = "README quickstart: the local dev bootstrap token, documented as dev-only"
condition = "AND"
paths = ['''^README\.md$''']
regexTarget = "secret"
regexes = ['''^dev-bootstrap$''']

[[allowlists]]
description = "Shell variable references passed to curl --user (the values come from the environment, never the file)"
condition = "AND"
paths = ['''^docker-compose\.yml$''', '''^\.github/workflows/ci\.yml$''']
regexTarget = "secret"
regexes = [
  '''^"\$\$\{AWS_ACCESS_KEY_ID\}:\$\$\{AWS_SECRET_ACCESS_KEY\}"$''',
  '''^"\$\$S3_ACCESS_KEY_ID:\$\$S3_SECRET_ACCESS_KEY"$''',
]

[[allowlists]]
description = "The former dev/CI object-store default (synthetic, public in README since ADR-0060), only in the commit that moved CI to SeaweedFS; later commits use regulait-dev-objectstore via env"
condition = "AND"
paths = ['''^\.github/workflows/ci\.yml$''']
commits = ["37c0de01f66c77557f914ca3d3a4a2d6ab2d2b58"]
regexTarget = "secret"
regexes = ['''^regulait:regulait-dev-minio$''']

[[allowlists]]
description = "RFC 6238 Appendix B public test seed (ASCII 12345678901234567890 in base32)"
condition = "AND"
paths = ['''^apps/gateway/src/totp\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']

[[allowlists]]
description = "Synthetic AWS-key-shaped passkey label: the B4 step-up test proves a secret-shaped label is redacted before storage (never a real key)"
condition = "AND"
paths = ['''^apps/gateway/src/zz-b4a-step-up\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^AKIAZ7XQK3NWQOPXR4LT$''']

[[allowlists]]
description = "Placeholder ciphertext literal in the B4 approver-eligibility test (marks a user as TOTP-enrolled; never decrypted)"
condition = "AND"
paths = ['''^apps/gateway/src/zz-b4s-approver-eligibility\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^b4s1-synthetic$''']

[[allowlists]]
description = "ADR-0188 S3: earlier commits on this branch held the PEM-block parsing regex as a source literal (not key material; the current code builds the pattern at runtime). Matches only a 'secret' containing the regex source text, in this one file."
condition = "AND"
paths = ['''^apps/gateway/src/identity-signing-keys\.ts$''']
regexTarget = "secret"
regexes = ['''\[\\s\\S\]\*\?-----END PRIVATE KEY-----''']

[[allowlists]]
