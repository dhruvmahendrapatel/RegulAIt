[[allowlists]]
description = "B4I-02 scrub-equivalence snapshot: a SHA-256 group digest of scrub output (not a key)"
condition = "AND"
paths = ['''^packages/shared/src/detection-content/scrub-equivalence\.snapshot\.json$''']
regexTarget = "secret"
regexes = ['''^283f4705bdec4d97544386f0aad190c9d4a7c09824b2adb8a65a25f6180e0355$''']

[[allowlists]]
